import os
import shlex
import shutil
import subprocess
import sys

config.suffixes = ['.test']
config.excludes = ['Inputs']

if config.target_arch == 'riscv64' and config.operating_system == 'Linux':
    library = os.path.join(config.library_dir, 'libomp.so')
    helper = os.path.join(os.path.dirname(__file__), 'Inputs', 'rv64-cfi-check.py')
    path = config.environment.get('PATH', '')
    objdump = shutil.which('riscv64-linux-gnu-objdump', path=path) or shutil.which('objdump', path=path)
    readelf = shutil.which('riscv64-linux-gnu-readelf', path=path) or shutil.which('readelf', path=path)
    probe = subprocess.run([sys.executable, helper, '--probe', '--library', library,
                            '--objdump', objdump or '', '--readelf', readelf or ''],
                           stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
    if probe.returncode == 0:
        config.available_features.add('rv64-cfi-gnu')
        for name, value in (('%libomp-cfi-library', library), ('%libomp-cfi-objdump', objdump),
                            ('%libomp-cfi-readelf', readelf)):
            config.substitutions.append((name, shlex.quote(value)))
    elif probe.returncode == 77:
        lit_config.note(probe.stdout.strip())
    else:
        lit_config.fatal('RV64 CFI capability probe failed: ' + probe.stdout.strip())
