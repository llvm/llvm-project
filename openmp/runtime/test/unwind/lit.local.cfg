import os
import shlex
import shutil

config.suffixes = [".test"]

if config.target_arch == "riscv64" and config.operating_system == "Linux":
    path = os.pathsep.join(
        p for p in [config.llvm_tools_dir, config.environment.get("PATH", "")] if p
    )
    dwarfdump = shutil.which("llvm-dwarfdump", path=path)
    filecheck = shutil.which(config.test_filecheck or "FileCheck", path=path)
    if dwarfdump and filecheck:
        config.available_features.add("rv64-cfi-llvm")
        config.substitutions.extend(
            [
                ("%libomp-dwarfdump", shlex.quote(dwarfdump)),
                ("%libomp-cfi-check", shlex.quote(filecheck)),
                (
                    "%libomp-cfi-flags",
                    config.test_extra_flags
                    + " -I "
                    + shlex.quote(config.omp_header_directory),
                ),
            ]
        )
    else:
        lit_config.note("Skipping RV64 CFI test: llvm-dwarfdump or FileCheck not found")
