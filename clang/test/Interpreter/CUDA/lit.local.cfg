import subprocess

import lit.util


def have_host_clang_repl_cuda():
    # Launch a kernel through clang-repl. The execution tests need the
    # toolkit, the driver and a device, which only a launch shows. A hung
    # driver would stall test discovery, hence the timeout.
    clang_repl_exe = lit.util.which("clang-repl", config.clang_tools_dir)

    if not clang_repl_exe:
        return False

    testcode = b"\n".join(
        [
            b"__global__ void test_func() {}",
            b"test_func<<<1,1>>>();",
            b'extern "C" int puts(const char *s);',
            b'puts(cudaGetLastError() ? "failure" : "success");',
            b"%quit",
        ]
    )
    try:
        clang_repl_cmd = subprocess.run(
            [clang_repl_exe, "--cuda"],
            stdout=subprocess.PIPE,
            stderr=subprocess.PIPE,
            input=testcode,
            timeout=60,
        )
    except OSError:
        return False
    except subprocess.TimeoutExpired:
        lit_config.warning("clang-repl --cuda did not finish the launch probe")
        return False

    return clang_repl_cmd.returncode == 0 and b"success" in clang_repl_cmd.stdout


if (
    "nvptx-registered-target" not in config.available_features
    or "system-linux" not in config.available_features
    or "host-supports-jit" not in config.available_features
):
    config.unsupported = True
elif have_host_clang_repl_cuda():
    # The tests that execute a kernel carry REQUIRES: host-supports-cuda.
    config.available_features.add("host-supports-cuda")
