import ctypes

if "host-supports-jit" not in config.available_features:
    config.unsupported = True
elif "amdgpu-registered-target" not in config.available_features:
    config.unsupported = True
else:
    # clang-repl loads the HIP runtime on startup, so it must be available.
    try:
        ctypes.CDLL("libamdhip64.so")
    except OSError:
        config.unsupported = True
