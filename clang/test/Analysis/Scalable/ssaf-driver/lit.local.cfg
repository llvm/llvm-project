# -*- Python -*-

import lit.util
import os
import platform
import subprocess
import tempfile

if platform.system() == "Windows":
    config.unsupported = True


def _run(command, stdin=None):
    try:
        return subprocess.run(
            command,
            input=stdin,
            stdout=subprocess.PIPE,
            stderr=subprocess.DEVNULL,
            env=config.environment,
        )
    except OSError:
        return None


def _succeeds(command, stdin=None):
    done = _run(command, stdin)
    return done is not None and done.returncode == 0


# The tests build projects with make, so they need GNU make, and a clang and
# an ar that compile, archive and link C++ programs for the host.
def _can_build_projects():
    path = config.environment["PATH"]
    make = lit.util.which("make", path)
    version = _run([make, "--version"]) if make else None
    if not version or version.returncode or not version.stdout.startswith(b"GNU Make"):
        return False
    ar = lit.util.which("ar", path)
    with tempfile.TemporaryDirectory() as tmp:
        obj = os.path.join(tmp, "a.o")
        cxx = [config.clang, "--driver-mode=g++"]
        main = b"int main() { return 0; }\n"
        return (
            ar is not None
            and _succeeds(cxx + ["-x", "c++", "-", "-c", "-o", obj], main)
            and _succeeds([ar, "rcs", os.path.join(tmp, "liba.a"), obj])
            and _succeeds(cxx + [obj, "-o", os.path.join(tmp, "a.out")])
        )


if "native" in config.available_features and _can_build_projects():
    config.available_features.add("ssaf-driver-make-build")

# GNU and BSD patch answer --version and take the options the tests use.
if _succeeds(["patch", "--version"]):
    config.available_features.add("patch")

config.substitutions.append(
    (
        "%clang-ssaf-driver",
        '"%s" "%s"'
        % (
            config.python_executable,
            os.path.join(config.llvm_tools_dir, "clang-ssaf-driver"),
        ),
    )
)

config.substitutions.append(
    ("%ssaf-driver-python", '"%s"' % config.python_executable)
)

config.substitutions.append(
    (
        "%ssaf-driver-libs",
        os.path.join(os.path.dirname(config.llvm_tools_dir), "lib"),
    )
)

config.substitutions.append(
    (
        "%ssaf-driver-src",
        os.path.join(config.clang_src_dir, "tools", "clang-ssaf-driver"),
    )
)

config.substitutions.append(
    (
        "%ssaf-driver-clang",
        config.clang if config.have_llvm_driver else os.path.realpath(config.clang),
    )
)
