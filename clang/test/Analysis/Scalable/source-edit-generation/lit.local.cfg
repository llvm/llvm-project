import lit.util

# clang-apply-replacements (from clang-tools-extra) availability, so the
# cpp-bounded-buffers-replacements.cpp test can also verify its generated
# replacements get applied correctly when clang-tools-extra is enabled
# alongside clang.
if lit.util.which("clang-apply-replacements", config.llvm_tools_dir):
    config.available_features.add("clang-apply-replacements")
