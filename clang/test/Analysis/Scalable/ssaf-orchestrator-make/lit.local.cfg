# -*- Python -*-

import lit.util
import os
import platform

if platform.system() != "Windows" and lit.util.which("make"):
    config.available_features.add("ssaf-orchestrator-make-build")

config.substitutions.append(
    (
        "%clang-ssaf-orchestrator-make",
        '"%s" "%s"'
        % (
            config.python_executable,
            os.path.join(config.llvm_tools_dir, "clang-ssaf-orchestrator-make"),
        ),
    )
)

config.substitutions.append(
    ("%ssaf-orchestrator-make-python", '"%s"' % config.python_executable)
)

config.substitutions.append(
    (
        "%ssaf-orchestrator-make-libs",
        os.path.join(os.path.dirname(config.llvm_tools_dir), "lib"),
    )
)

config.substitutions.append(
    (
        "%ssaf-orchestrator-make-shims",
        os.path.join(
            os.path.dirname(config.llvm_tools_dir),
            "libexec",
            "ssaf-orchestrator-shims",
        ),
    )
)

if "SDKROOT" in config.environment:
    config.available_features.add("ssaf-orchestrator-make-sdkroot")

config.substitutions.append(
    (
        "%ssaf-orchestrator-make-src",
        os.path.join(config.clang_src_dir, "tools", "clang-ssaf-orchestrator-make"),
    )
)

config.substitutions.append(
    ("%ssaf-orchestrator-make-env-path", config.environment["PATH"])
)

config.substitutions.append(
    (
        "%ssaf-orchestrator-make-clang",
        config.clang if config.have_llvm_driver else os.path.realpath(config.clang),
    )
)
