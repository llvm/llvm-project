import os

# Kernels run on an Apple GPU under Asahi Linux through MLIR's CUDA runtime
# wrappers built against ZLUDA's CUDA driver (MLIR_ENABLE_AGX_RUNNER).
if not config.enable_agx_runner:
    config.unsupported = True

config.substitutions.append(("%chip", os.environ.get("MLIR_AGX_TEST_CHIP", "agx-g14g")))
config.substitutions.append(
    ("%mlir_agx_runtime", os.path.join(config.mlir_lib_dir, "libmlir_agx_runtime" + config.llvm_shlib_ext))
)
