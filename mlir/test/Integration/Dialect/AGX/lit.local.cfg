import os
import shutil

# The tests run kernels on the functional AGX simulator (agx_run of
# AGX-Performance-Simulator), found through AGX_RUN or on the PATH.
agx_run = os.environ.get("AGX_RUN") or shutil.which("agx_run")
if not agx_run:
    config.unsupported = True
else:
    config.substitutions.append(
        (
            "%run_agx",
            "%s %s --llc %s --objcopy %s --readelf %s --mlir-translate %s --agx-run %s"
            % (
                config.python_executable,
                os.path.join(os.path.dirname(__file__), "run-agx.py"),
                os.path.join(config.llvm_tools_dir, "llc"),
                os.path.join(config.llvm_tools_dir, "llvm-objcopy"),
                os.path.join(config.llvm_tools_dir, "llvm-readelf"),
                os.path.join(config.mlir_tools_dir, "mlir-translate"),
                agx_run,
            ),
        )
    )
config.excludes = ["run-agx.py"]
