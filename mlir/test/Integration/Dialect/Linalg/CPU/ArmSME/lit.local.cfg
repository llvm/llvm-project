import sys

# ArmSME tests must be enabled via build flag.
if not config.mlir_run_arm_sme_tests:
    config.unsupported = True

# No JIT on win32.
if sys.platform == "win32":
    config.unsupported = True

# FIXME: The AArch64 backend emits the calls to the SME ABI routines (e.g.,
# __arm_tpidr2_save) as direct BLs and ignores the code model. Under ASan those
# routines can be more than 128 MB away, which RuntimeDyld (MachO AArch64)
# cannot encode. See https://github.com/llvm/llvm-project/issues/233479.
if "asan" in config.available_features and "system-darwin" in config.available_features:
    config.unsupported = True
