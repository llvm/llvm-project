# RUN: yaml2obj %s -o %t.o
# RUN: not wasm-ld --no-entry --export=foo --export=bar %t.o -o /dev/null 2>&1 | FileCheck %s

# CHECK: error: common symbols section size overflow

--- !WASM
FileHeader:
  Version:         0x00000001
Sections:
  - Type:            CUSTOM
    Name:            linking
    Version:         2
    SymbolTable:
      - Index:           0
        Kind:            DATA
        Name:            foo
        Flags:           [ BINDING_COMMON ]
        Size:            4294967295
        Align:           2
      - Index:           1
        Kind:            DATA
        Name:            bar
        Flags:           [ BINDING_COMMON ]
        Size:            16
        Align:           2
...
