# This file has the declarations of <sys/select.h> that POSIX also requires
# <sys/time.h> to provide.

macros:
  - macro_name: FD_CLR
    macro_header: sys-select-macros.h
  - macro_name: FD_ISSET
    macro_header: sys-select-macros.h
  - macro_name: FD_SET
    macro_header: sys-select-macros.h
  - macro_name: FD_ZERO
    macro_header: sys-select-macros.h
  - macro_name: FD_SETSIZE
    macro_header: sys-select-macros.h
types:
  - type_name: fd_set
  - type_name: struct_timeval
functions:
  - name: select
    standards:
      - posix
    return_type: int
    arguments:
      - type: int
      - type: fd_set *__restrict
      - type: fd_set *__restrict
      - type: fd_set *__restrict
      - type: struct timeval *__restrict
