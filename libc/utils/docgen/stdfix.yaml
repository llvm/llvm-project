standard: iso-tr-18037
family-note: 'Columns list the 12 fixed-point suffixes: `uhr`/`hr` (`unsigned`/`signed
  short fract`), `ur`/`r` (`unsigned`/`signed fract`), `ulr`/`lr` (`unsigned`/`signed
  long fract`), and `uhk`/`hk`, `uk`/`k`, `ulk`/`lk` for the corresponding `accum`
  types.  See {doc}`../math/stdfix` for compiler requirements, precision macros, formatted
  I/O specifiers, and ABI notes.'
