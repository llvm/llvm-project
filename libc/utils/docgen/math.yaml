standard: c23
posix: posix-2024
c-reference-root: numeric/math
family-note: "`✓` indicates correctly rounded for all four rounding modes; ULP values\
  \ list the largest recorded error; `N/A` marks variants not defined for that format.\
  \  `long double` (`*l`) entrypoints alias `double`, `f80`, `double-double`, or\
  \ `_Float128` according to the target ABI, and the `bfloat16` `log` entrypoint\
  \ is named `log_bf16` to avoid colliding with `_Float16` `logb` (`logbf16`). \
  \ See {doc}`../math/index` for accuracy goals, GPU conformance, performance benchmarks,\
  \ and algorithm notes."
family-columns:
- key: float
  label: float
- key: double
  label: double
- key: float80
  label: f80
- key: double_double
  label: double-double
- key: float16
  label: _Float16
- key: float128
  label: _Float128
- key: bfloat16
  label: bfloat16
