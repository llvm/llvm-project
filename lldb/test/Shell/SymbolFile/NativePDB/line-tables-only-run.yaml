# REQUIRES: system-windows, target-x86_64

# Check that lldb can generate a backtrace when fed with a PDB without locals or function types.

# RUN: mkdir -p %t.dir
# RUN: llvm-pdbutil yaml2pdb %p/Inputs/line-tables-only-pdb.yaml --pdb=%t.dir/line-tables-only.pdb
# RUN: yaml2obj %s -o %t.dir/line-tables-only.exe

# RUN: %lldb %t.dir/line-tables-only.exe -o 'b line-tables-only.cpp:3' -o r -o bt -o q | FileCheck %s

# CHECK:      (lldb) target create
# CHECK-NEXT: Current executable set to '{{.*}}' (x86_64).
# CHECK-NEXT: (lldb) b line-tables-only.cpp:3
# CHECK-NEXT: Breakpoint 1: where = {{.*}}.exe`stopHere + 9 at line-tables-only.cpp:3
# CHECK-NEXT: (lldb) r
# CHECK-NEXT: Process {{.*}} launched: '{{.*}}' (x86_64)
# CHECK-NEXT: Process {{.*}} stopped
# CHECK-NEXT: * thread #1, stop reason = breakpoint 1.1
# CHECK-NEXT:        frame #0: {{.*}} {{.*}}.exe`stopHere at line-tables-only.cpp:3
# CHECK-NEXT: (lldb) bt
# CHECK-NEXT: * thread #1, stop reason = breakpoint 1.1
# CHECK-NEXT:    * frame #{{[0-9]+}}: {{.*}}.exe`stopHere at line-tables-only.cpp:3
# CHECK-NEXT:      frame #{{[0-9]+}}: {{.*}}.exe`inlineme_too at line-tables-only.cpp:7 [inlined]
# CHECK-NEXT:      frame #{{[0-9]+}}: {{.*}}.exe`inlineme at line-tables-only.cpp:12 [inlined]
# CHECK-NEXT:      frame #{{[0-9]+}}: {{.*}}.exe`foo at line-tables-only.cpp:15
# CHECK-NEXT:      frame #{{[0-9]+}}: {{.*}}.exe`int callme(void) at line-tables-only.cpp:17
# CHECK-NEXT:      frame #{{[0-9]+}}: {{.*}}.exe`main at line-tables-only.cpp:19

