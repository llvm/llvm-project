  - Name:            .rel.debug_info
    Type:            SHT_REL
    Link:            .symtab
    AddressAlign:    0x4
    Info:            .debug_info
    Relocations:
      - Offset:          0x5
        Symbol:          var
        Type:            R_386_32
      - Offset:          0xFFFFFFFC
        Symbol:          var
        Type:            R_386_32
Symbols:
  - Name:            var
    Type:            STT_OBJECT
