# N_AST stabs name a compiler AST file.

# RUN: yaml2obj %s -o %t
# RUN: %lldb %t -o "target modules dump symtab" | FileCheck %s

# CHECK: ASTFile {{.*}} /tmp/a.swiftmodule

--- !mach-o
IsLittleEndian:  true
FileHeader:
  magic:           0xFEEDFACF
  cputype:         0x0100000C
  cpusubtype:      0x00000000
  filetype:        0x00000002
  ncmds:           3
  sizeofcmds:      248
  flags:           0x00000000
  reserved:        0x00000000
LoadCommands:
  - cmd:             LC_SEGMENT_64
    cmdsize:         152
    segname:         __TEXT
    vmaddr:          4294967296
    vmsize:          4096
    fileoff:         0
    filesize:        4096
    maxprot:         5
    initprot:        5
    nsects:          1
    flags:           0
    Sections:
      - sectname:        __text
        segname:         __TEXT
        addr:            0x0000000100000F00
        size:            4
        offset:          0x00000F00
        align:           2
        reloff:          0x00000000
        nreloc:          0
        flags:           0x80000400
        reserved1:       0x00000000
        reserved2:       0x00000000
        reserved3:       0x00000000
  - cmd:             LC_SEGMENT_64
    cmdsize:         72
    segname:         __LINKEDIT
    vmaddr:          4294971392
    vmsize:          4096
    fileoff:         4096
    filesize:        36
    maxprot:         1
    initprot:        1
    nsects:          0
    flags:           0
  - cmd:             LC_SYMTAB
    cmdsize:         24
    symoff:          4096
    nsyms:           1
    stroff:          4112
    strsize:         20
LinkEditData:
  NameList:
    - n_strx:          1
      n_type:          0x32
      n_sect:          0
      n_desc:          0
      n_value:         0
  StringTable:
    - ''
    - /tmp/a.swiftmodule
...
