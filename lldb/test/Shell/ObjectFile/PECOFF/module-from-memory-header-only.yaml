# REQUIRES: python
# RUN: yaml2obj %s -o %t
# RUN: %lldb -b -c %t \
# RUN:   -o "script module = lldb.SBModule(lldb.process, 0x180000000)" \
# RUN:   -o "script print('sections', module.GetNumSections())" \
# RUN:   -o "script print('symbols', module.GetNumSymbols())" \
# RUN:   -o "script print('text', module.FindSection('.text').GetSectionData().GetByteSize())" \
# RUN:   | FileCheck %s

# A core file that holds only the first 512 bytes of a DLL, at its image base.
# lldb can parse the DLL's headers and sections from that, but llvm::object
# cannot create a COFFObjectFile because the export table and section contents
# are missing. Reading such a module from memory must not crash.

# CHECK: sections 4
# CHECK: symbols 0
# CHECK: text 0

# The memory is the start of the DLL built from symbols-export-table.yaml.
--- !ELF
FileHeader:
  Class:   ELFCLASS64
  Data:    ELFDATA2LSB
  Type:    ET_CORE
  Machine: EM_X86_64
  OSABI:   ELFOSABI_LINUX
ProgramHeaders:
  - Type:     PT_NOTE
    FirstSec: .note
    LastSec:  .note
  - Type:     PT_LOAD
    Flags:    [ PF_R ]
    VAddr:    0x180000000
    Align:    0x1000
    FirstSec: .memory
    LastSec:  .memory
Sections:
  - Name: .note
    Type: SHT_NOTE
    Notes:
      - Name: CORE
        Type: NT_FILE
        Desc: 010000000000000000100000000000000000008001000000004000800100000000000000000000002f746d702f746573742e646c6c00
  - Name:    .memory
    Type:    SHT_PROGBITS
    Flags:   [ SHF_ALLOC ]
    Address: 0x180000000
    AddressAlign: 0x1000
    Content: 
