# Thread 1: rip=0x140001000 (leaf), rsp=0x20000, rbp=0.
# Thread 2: rip=0x140002000 (unnamed trampoline), rsp=0x20008, rbp=0.
# Thread 3: rip=0x140001000 (leaf), rsp=0x20100, rbp=0; its saved return PC
# points to tramp+1 (0x140002021), exactly at the named trampoline's second row.
# Stack: trampoline PC, padding, interrupted caller PC, and a zero return PC.
# Using the unnamed trampoline's second row, or the named trampoline's first
# row, would read zero instead of caller.
--- !minidump
Streams:
  - Type:            ThreadList
    Threads:
      - Thread Id:       0x00001000
        Context:         
        Stack:
          Start of Memory Range: 0x20000
          Content:         0020004001000000000000000000000010100040010000000000000000000000
      - Thread Id:       0x00001001
        Context:         
        Stack:
          Start of Memory Range: 0x20000
          Content:         0020004001000000000000000000000010100040010000000000000000000000
      - Thread Id:       0x00001002
        Context:         
        Stack:
          Start of Memory Range: 0x20100
          Content:         2120004001000000000000000000000010100040010000000000000000000000
  - Type:            MemoryList
    Memory Ranges:
      - Start of Memory Range: 0x20000
        Content:         0020004001000000000000000000000010100040010000000000000000000000
      - Start of Memory Range: 0x20100
        Content:         2120004001000000000000000000000010100040010000000000000000000000
  - Type:            ModuleList
    Modules:
      - Base of Image:   0x140000000
        Size of Image:   0x00004000
        Module Name:     'signal-frame-no-symbol.exe'
        CodeView Record: ''
  - Type:            SystemInfo
    Processor Arch:  AMD64
    Platform ID:     Win32NT
    CPU:
      Vendor ID:       GenuineIntel
      Version Info:    0x00000000
      Feature Info:    0x00000000
...
