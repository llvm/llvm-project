# The trampoline is in its own section with no symbols. "previous" ends at
# the section boundary immediately before it, so resolving trampoline - 1
# succeeds while resolving trampoline fails. PE/COFF does not synthesize symbols
# from FDEs.
#
# .eh_frame contains ordinary FDEs for leaf (0x1000), caller (0x1010), and
# previous (0x1ff0), followed by a zRS CIE and an FDE for the trampoline (0x2000).
# The ordinary CIE has CFA=rsp+8 and rip=[CFA-8]. caller marks rip undefined.
# The trampoline FDE is equivalent to:
#   .cfi_startproc
#   .cfi_signal_frame
#   .cfi_def_cfa_offset 16
#   nop
#   .cfi_def_cfa_offset 24
#   .space 15
#   .cfi_endproc
