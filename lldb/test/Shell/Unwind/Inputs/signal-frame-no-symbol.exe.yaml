# The unnamed trampoline starts a section before any symbols in that section.
# "previous" ends at the section boundary immediately before it, so resolving
# trampoline - 1 succeeds while resolving trampoline fails. PE/COFF does not
# synthesize symbols from FDEs.
#
# .eh_frame contains ordinary FDEs for leaf (0x1000), caller (0x1010), and
# previous (0x1ff0), followed by a zRS CIE and an FDE for the trampoline (0x2000).
# A second signal FDE covers the named trampoline tramp (0x2020). Its initial
# row has CFA=rsp+24, changing to CFA=rsp+16 at offset 1, where thread 3's
# return PC points. Selecting PC - 1 would therefore read a zero return PC.
# The ordinary CIE has CFA=rsp+8 and rip=[CFA-8]. caller marks rip undefined.
# The unnamed trampoline FDE is equivalent to:
#   .cfi_startproc
#   .cfi_signal_frame
#   .cfi_def_cfa_offset 16
#   nop
#   .cfi_def_cfa_offset 24
#   .space 15
#   .cfi_endproc
--- !COFF
