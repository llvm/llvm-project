# NT_FILE lists two images whose ELF headers are in core memory. The program
# header of /tmp/libbogus.so (at 0x400000) is a PT_NOTE with a p_memsz of
# 0x100000000000 (16 TiB), far more than the core holds, as when the program
# headers read from memory are garbage. /tmp/libgood.so (at 0x500000) has a
# valid PT_NOTE with an NT_GNU_BUILD_ID note.
--- !ELF
FileHeader:
  Class:   ELFCLASS64
  Data:    ELFDATA2LSB
  Type:    ET_CORE
  Machine: EM_X86_64
  OSABI:   ELFOSABI_LINUX
ProgramHeaders:
  - Type:     PT_NOTE
    FirstSec: .note
    LastSec:  .note
  - Type:     PT_LOAD
    Flags:    [ PF_R ]
    FirstSec: .bogus
    LastSec:  .bogus
    VAddr:    0x400000
    Align:    0x1000
    MemSize:  0x1000
  - Type:     PT_LOAD
    Flags:    [ PF_R ]
    FirstSec: .good
    LastSec:  .good
    VAddr:    0x500000
    Align:    0x1000
    MemSize:  0x1000
Sections:
  - Name: .note
    Type: SHT_NOTE
    Notes:
      - Name: CORE
        Type: NT_FILE
        Desc: 020000000000000000100000000000000000400000000000001040000000000000000000000000000000500000000000001050000000000000000000000000002f746d702f6c6962626f6775732e736f002f746d702f6c6962676f6f642e736f00
  - Name:         .bogus
    Type:         SHT_PROGBITS
    Flags:        [ SHF_ALLOC ]
    Address:      0x400000
    AddressAlign: 0x1000
    Content:      7f454c4602010100000000000000000003003e0001000000000000000000000040000000000000000000000000000000000000004000380001000000000000000400000004000000000000000000000000010000000000000000000000000000000000000010000000000000001000000400000000000000
  - Name:         .good
    Type:         SHT_PROGBITS
    Flags:        [ SHF_ALLOC ]
    Address:      0x500000
    AddressAlign: 0x1000
    Content:      
