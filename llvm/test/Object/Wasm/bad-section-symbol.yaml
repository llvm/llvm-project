# RUN: yaml2obj %s --docnum=1 | not llvm-objdump -s - 2>&1 | FileCheck %s --check-prefix=OOB
# RUN: yaml2obj %s --docnum=2 | not llvm-objdump -s - 2>&1 | FileCheck %s --check-prefix=NON-CUSTOM
# RUN: yaml2obj %s --docnum=3 | not llvm-objdump -s - 2>&1 | FileCheck %s --check-prefix=NON-LOCAL

# OOB: invalid section symbol index
--- !WASM
FileHeader:
  Version:         0x00000001
Sections:
  - Type:            CUSTOM
    Name:            linking
    Version:         2
    SymbolTable:
      - Index:           0
        Kind:            SECTION
        Flags:           [ BINDING_LOCAL ]
        Section:         42

# NON-CUSTOM: section symbols must reference custom sections
--- !WASM
FileHeader:
  Version:         0x00000001
Sections:
  - Type:            TYPE
    Signatures:
      - Index:           0
        ParamTypes:      []
        ReturnTypes:     []
  - Type:            FUNCTION
    FunctionTypes:   [ 0 ]
  - Type:            CODE
    Functions:
      - Index:           0
        Locals:          []
        Body:            0B
  - Type:            CUSTOM
    Name:            linking
    Version:         2
    SymbolTable:
      - Index:           0
        Kind:            SECTION
        Flags:           [ BINDING_LOCAL ]
        Section:         2

# NON-LOCAL: section symbols must have local binding
--- !WASM
FileHeader:
  Version:         0x00000001
Sections:
  - Type:            CUSTOM
    Name:            foo
    Payload:         '00'
  - Type:            CUSTOM
    Name:            linking
    Version:         2
    SymbolTable:
      - Index:           0
        Kind:            SECTION
        Flags:           [ ]
        Section:         0
...
