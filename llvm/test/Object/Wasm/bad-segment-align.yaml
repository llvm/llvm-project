# RUN: yaml2obj %s | not llvm-objdump -s - 2>&1 | FileCheck %s

# Check that a data segment cannot have an alignment > 32.

# CHECK: invalid data segment alignment: `foo` (alignment: 33)

--- !WASM
FileHeader:
  Version:         0x00000001
Sections:
  - Type:            DATA
    Segments:
      - SectionOffset:   0
        InitFlags:       0
        Offset:
          Opcode:          I32_CONST
          Value:           0
        Content:         '00'
  - Type:            CUSTOM
    Name:            linking
    Version:         2
    SegmentInfo:
      - Index:           0
        Name:            foo
        Alignment:       33
        Flags:           [ ]
...
