## LC_TARGET_TRIPLE whose triple string has no NUL terminator before the end
## of the load command.
--- !mach-o
IsLittleEndian:  true
FileHeader:
  magic:           0xFEEDFACE
  cputype:         0x00000007
  cpusubtype:      0x00000003
  filetype:        0x00000001
  ncmds:           1
  sizeofcmds:      12
  flags:           0x00000000
LoadCommands:
  - cmd:             LC_TARGET_TRIPLE
    cmdsize:         16
    triple:          12
    Content:         'abcd'
...
