import platform

if not config.have_ondisk_cas:
    config.unsupported = True

if config.llvm_cas_plugin_test_path:
    config.available_features.add("cas-plugin")
    config.substitutions.append(("%cas_plugin", config.llvm_cas_plugin_test_path))

# Validation is only skipped where the boot time is known, see getBootTime().
# This may not list all such platforms, but tests that require it only need to
# run on some.
if platform.system() in ("Darwin", "Linux"):
    config.available_features.add("cas-boot-time")
