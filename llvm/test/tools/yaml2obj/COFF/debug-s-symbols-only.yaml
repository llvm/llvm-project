## A .debug$S section that holds only symbols subsections needs no string
## table: yaml2obj writes it although the object has none, and it round-trips
## through obj2yaml.

# RUN: yaml2obj %s -o %t.obj
# RUN: llvm-readobj --codeview %t.obj | FileCheck %s
# RUN: obj2yaml %t.obj | yaml2obj -o %t.2.obj
# RUN: cmp %t.obj %t.2.obj

# CHECK:      SubSectionType: Symbols (0xF1)
# CHECK:      UDTSym {
# CHECK-NEXT:   Kind: S_UDT (0x1108)
# CHECK-NEXT:   Type: int (0x74)
# CHECK-NEXT:   UDTName: a
# CHECK-NOT:  StringTable

--- !COFF
header:
  Machine:         IMAGE_FILE_MACHINE_AMD64
  Characteristics: [  ]
sections:
  - Name:            '.debug$S'
    Characteristics: [ IMAGE_SCN_CNT_INITIALIZED_DATA, IMAGE_SCN_MEM_DISCARDABLE, IMAGE_SCN_MEM_READ ]
    Alignment:       4
    Subsections:
      - !Symbols
        Records:
          - Kind:            S_UDT
            UDTSym:
              Type:            116
              UDTName:         a
symbols:         []
...
