# RUN:       --implicit-check-not=error: --implicit-check-not=DW_TAG

#       DETAILS: error: Invalid address range [0x0000000000001000, 0x0000000000000900)
# DETAILS-EMPTY:
#  DETAILS-NEXT: 0x00000010: DW_TAG_subprogram
#  DETAILS-NEXT:   DW_AT_name {{.*}} = "foo")
#       DETAILS: error: Invalid address range [0x0000000000003000, 0x0000000000002000)
# DETAILS-EMPTY:
#  DETAILS-NEXT: 0x00000025: DW_TAG_subprogram
#  DETAILS-NEXT:   DW_AT_name {{.*}} = "bar")
#       SUMMARY: error: Aggregated error counts:
#  SUMMARY-NEXT: error: Invalid address range occurred 2 time(s).
#         CHECK: Errors detected.

# RUN: FileCheck %s --check-prefix=JSON --input-file=%t.full.json
# RUN: cmp %t.full.json %t.details.json
# RUN: cmp %t.full.json %t.summary.json
# RUN: cmp %t.full.json %t.quiet.json

# JSON: {"error-categories":{"Invalid address range":{"count":2,"details":{}}},"error-count":2}

--- !ELF
FileHeader:
  Class: ELFCLASS64
  Data:  ELFDATA2LSB
  Type:  ET_EXEC
DWARF:
  debug_str:
    - ''
    - /tmp/main.c
    - foo
    - bar
  debug_abbrev:
    - Table:
        - Code:            0x00000001
          Tag:             DW_TAG_compile_unit
          Children:        DW_CHILDREN_yes
          Attributes:
            - Attribute:       DW_AT_name
              Form:            DW_FORM_strp
        - Code:            0x00000002
          Tag:             DW_TAG_subprogram
          Children:        DW_CHILDREN_no
          Attributes:
            - Attribute:       DW_AT_name
              Form:            DW_FORM_strp
            - Attribute:       DW_AT_low_pc
              Form:            DW_FORM_addr
            - Attribute:       DW_AT_high_pc
              Form:            DW_FORM_addr
  debug_info:
    - Version:         4
      AddrSize:        8
      Entries:
        - AbbrCode:        0x00000001
          Values:
            - Value:           0x0000000000000001
        - AbbrCode:        0x00000002
          Values:
            - Value:           0x000000000000000D
            - Value:           0x0000000000001000
            - Value:           0x0000000000000900
        - AbbrCode:        0x00000002
          Values:
            - Value:           0x0000000000000011
            - Value:           0x0000000000003000
            - Value:           0x0000000000002000
        - AbbrCode:        0x00000000
