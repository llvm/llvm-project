## Check what each --error-display mode prints when the verifier finds errors:
## the per-error details, the aggregated error counts, both, or neither.
## Every mode prints "Errors detected." and exits with a non-zero status, and
## none of them affects the JSON summary written by --verify-json.

# RUN: yaml2obj %s -o %t.o

## The default is "full".
# RUN: not llvm-dwarfdump --verify %t.o \
# RUN:   | FileCheck %s --check-prefixes=CHECK,DETAILS,SUMMARY \
# RUN:       --implicit-check-not=error: --implicit-check-not=DW_TAG
# RUN: not llvm-dwarfdump --error-display=full --verify-json=%t.full.json %t.o \
# RUN:   | FileCheck %s --check-prefixes=CHECK,DETAILS,SUMMARY \
# RUN:       --implicit-check-not=error: --implicit-check-not=DW_TAG
