## Without LZMA support, warn for .gnu_debugdata but keep the main .symtab.

# REQUIRES: !lzma

# RUN: yaml2obj %s -o %t
# RUN: llvm-gsymutil --convert %t -o %t.gsym 2>&1 | FileCheck %s

# CHECK: Loaded 1 functions from symbol table.
# CHECK: warning: unable to read the .gnu_debugdata section: missing LZMA support (LLVM_ENABLE_LZMA){{$}}
# CHECK: ended with 1 total

--- !ELF
FileHeader:
  Class:   ELFCLASS64
  Data:    ELFDATA2LSB
  Type:    ET_EXEC
  Machine: EM_X86_64
Sections:
  - Name:         .text
    Type:         SHT_PROGBITS
    Flags:        [ SHF_ALLOC, SHF_EXECINSTR ]
    Address:      0x1000
    AddressAlign: 0x10
    Size:         0x100
  - Name:         .gnu_debugdata
    Type:         SHT_PROGBITS
    AddressAlign: 0x1
    Content:      
Symbols:
  - Name:    real_func
    Type:    STT_FUNC
    Section: .text
    Value:   0x1000
    Size:    0x10
    Binding: STB_GLOBAL
