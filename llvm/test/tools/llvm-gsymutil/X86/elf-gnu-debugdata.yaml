## Test that llvm-gsymutil reads function symbols from the .gnu_debugdata
## (MiniDebugInfo) section of a stripped ELF file. The outer object has no
## .symtab: exported_func comes from .dynsym, and the other two functions come
## from the xz-compressed object in .gnu_debugdata.
##
## The .gnu_debugdata content is the object below, built with yaml2obj and then
## piped through `xz --check=crc32 -9 | xxd -p -u | tr -d '\n'`. Its .text is
## a NOBITS placeholder: MiniDebugInfo keeps only the symbol table.
##
##   --- !ELF
##   FileHeader:
##     Class:   ELFCLASS64
##     Data:    ELFDATA2LSB
##     Type:    ET_EXEC
##     Machine: EM_X86_64
##   Sections:
##     - Name:         .text
##       Type:         SHT_NOBITS
##       Flags:        [ SHF_ALLOC, SHF_EXECINSTR ]
##       Address:      0x1000
##       AddressAlign: 0x10
##       Size:         0x100
##   Symbols:
##     - Name:    stripped_func_one
##       Type:    STT_FUNC
##       Section: .text
##       Value:   0x1000
##       Size:    0x10
##     - Name:    stripped_func_two
##       Type:    STT_FUNC
##       Section: .text
##       Value:   0x1010
##       Size:    0x20

# REQUIRES: lzma

# RUN: yaml2obj %s -o %t
# RUN: llvm-gsymutil --convert %t -o %t.gsym 2>&1 | FileCheck %s --check-prefix=CONVERT
# RUN: llvm-gsymutil --address=0x1000 --address=0x1015 \
# RUN:   --address=0x1040 %t.gsym 2>&1 | FileCheck %s --check-prefix=ADDR
# RUN: llvm-gsymutil %t.gsym 2>&1 | FileCheck %s --check-prefix=DUMP

# CONVERT: Loaded 0 functions from symbol table.
# CONVERT: Loaded 1 functions from dynamic symbol table.
# CONVERT: Loaded 2 functions from .gnu_debugdata symbol table.

# ADDR: 0x0000000000001000: stripped_func_one
# ADDR: 0x0000000000001015: stripped_func_two
# ADDR: 0x0000000000001040: exported_func

# DUMP: FunctionInfo{{.*}}[0x0000000000001000 - 0x0000000000001010) "stripped_func_one"
# DUMP: FunctionInfo{{.*}}[0x0000000000001010 - 0x0000000000001030) "stripped_func_two"
# DUMP: FunctionInfo{{.*}}[0x0000000000001040 - 0x0000000000001050) "exported_func"

--- !ELF
FileHeader:
  Class:   ELFCLASS64
  Data:    ELFDATA2LSB
  Type:    ET_EXEC
  Machine: EM_X86_64
Sections:
  - Name:         .text
    Type:         SHT_PROGBITS
    Flags:        [ SHF_ALLOC, SHF_EXECINSTR ]
    Address:      0x1000
    AddressAlign: 0x10
    Size:         0x100
  - Name:         .gnu_debugdata
    Type:         SHT_PROGBITS
    AddressAlign: 0x1
    Content:      
DynamicSymbols:
  - Name:    exported_func
    Type:    STT_FUNC
    Section: .text
    Value:   0x1040
    Size:    0x10
    Binding: STB_GLOBAL
