## Test --stubs-file, which names mach-o symbol stubs from a second file
## without replacing the symbol table of the converted file.
##
## dsymutil copies LC_SYMTAB into a dSYM but not LC_DYSYMTAB, so a dSYM has the
## richer symbol table yet cannot name its own __stubs. --symtab-file cannot
## express that split, because it replaces the symbol table source.
##
## stubs.yaml is a complete image: __text with _main, a 12 byte __stubs entry
## at 0x100000410, and an indirect symbol table pointing it at the undefined
## _puts. dsym.yaml is the same image without LC_DYSYMTAB and with an extra
## defined symbol _helper, standing in for a dSYM whose symbol table is the
## richer of the two.

# RUN: split-file %s %t
# RUN: yaml2obj %t/stubs.yaml -o %t/stubs.o
# RUN: yaml2obj %t/dsym.yaml -o %t/dsym.o

## Converting the dSYM alone keeps both its symbols but cannot name the stub.
# RUN: llvm-gsymutil --convert %t/dsym.o -o %t/plain.gsym 2>&1 | FileCheck %s --check-prefix=PLAIN
# RUN: llvm-gsymutil --address=0x100000410 %t/plain.gsym 2>&1 | FileCheck %s --check-prefix=PLAIN-ADDR

## --stubs-file adds the stub and leaves the symbol table alone.
# RUN: llvm-gsymutil --convert %t/dsym.o --stubs-file=%t/stubs.o -o %t/stubs.gsym 2>&1 | FileCheck %s --check-prefix=STUBS
# RUN: llvm-gsymutil --address=0x100000400 --address=0x100000410 %t/stubs.gsym 2>&1 | FileCheck %s --check-prefix=STUBS-ADDR

## --symtab-file replaces it, which here loses _helper. Contrast with STUBS.
# RUN: llvm-gsymutil --convert %t/dsym.o --symtab-file=%t/stubs.o -o %t/symtab.gsym 2>&1 | FileCheck %s --check-prefix=SYMTAB

## Given both, the symbol table comes from --symtab-file and the stubs from
## --stubs-file; neither flag overrides the other.
# RUN: llvm-gsymutil --convert %t/dsym.o --symtab-file=%t/stubs.o --stubs-file=%t/stubs.o -o %t/both.gsym 2>&1 | FileCheck %s --check-prefix=BOTH
# RUN: llvm-gsymutil --address=0x100000410 %t/both.gsym 2>&1 | FileCheck %s --check-prefix=BOTH-ADDR

## A --stubs-file that is not an object file at all is an error.
# RUN: not llvm-gsymutil --convert %t/dsym.o --stubs-file=%t/dsym.yaml -o %t/bad.gsym 2>&1 | FileCheck %s --check-prefix=BADSTUBS

# PLAIN: Loaded 2 functions from symbol table.
# PLAIN: Loaded 0 functions from symbol stubs.
# PLAIN-ADDR: error: address 0x100000410 is not in GSYM

# STUBS: Using symbol stubs file: {{.*}}stubs.o
# STUBS: Loaded 2 functions from symbol table.
# STUBS: Loaded 1 functions from symbol stubs.
# STUBS-ADDR:      0x0000000100000400: main
# STUBS-ADDR-NEXT: 0x0000000100000410: symbol stub for: puts

# SYMTAB: Using symbol table file: {{.*}}stubs.o
# SYMTAB: Loaded 1 functions from symbol table.

# BOTH: Using symbol stubs file: {{.*}}stubs.o
# BOTH: Using symbol table file: {{.*}}stubs.o
# BOTH: Loaded 1 functions from symbol table.
# BOTH: Loaded 1 functions from symbol stubs.
# BOTH-ADDR: 0x0000000100000410: symbol stub for: puts

# BADSTUBS: The file was not recognized as a valid object file

## A --stubs-file that is a valid object but not mach-o is diagnosed, the stub
## pass is skipped, and the conversion still succeeds.
# RUN: yaml2obj %t/notmacho.yaml -o %t/notmacho.o
# RUN: llvm-gsymutil --convert %t/dsym.o --stubs-file=%t/notmacho.o -o %t/notmacho.gsym 2>&1 | FileCheck %s --check-prefix=NOTMACHO

# NOTMACHO: Loaded 2 functions from symbol table.
# NOTMACHO: warning: the symbol stubs file is not a mach-o file
# NOTMACHO-NOT: functions from symbol stubs

