## Test that function infos are synthesized for Mach-O symbol stubs.
##
## The __stubs section in this file has the S_SYMBOL_STUBS section type and
## holds a single 12 byte stub at 0x100000594. The "reserved2" field of the
## section header supplies the 12 byte stub size and the "reserved1" field is
## 1, which selects indirect symbol table entry 1. That entry holds symbol
## index 3, the undefined (N_UNDF) "_puts" symbol, so the stub is named after
## it. First we make the mach-o file from yaml, then we convert the object file
## to a GSYM file, then we do lookups on the newly created GSYM, and finally we
## dump the entire GSYM.

# RUN: yaml2obj %s -o %t
# RUN: llvm-gsymutil --convert %t -o %t.gsym 2>&1 | FileCheck %s --check-prefix=CONVERT
# RUN: llvm-gsymutil --address=0x100000560 --address=0x100000594 --address=0x10000059f --address=0x1000005a0 %t.gsym 2>&1 | FileCheck %s --check-prefix=ADDR
# RUN: llvm-gsymutil %t.gsym 2>&1 | FileCheck %s --check-prefix=DUMP

## One function comes from the symbol table ("main") and one stub is
## synthesized from the indirect symbol table.
# CONVERT: Input file: {{.*\.yaml\.tmp}}
# CONVERT: Output file (arm64): {{.*\.yaml\.tmp\.gsym}}
# CONVERT: Loaded 1 functions from symbol table.
# CONVERT: Loaded 1 functions from symbol stubs.
# CONVERT: Pruned 0 functions, ended with 2 total

## The stub covers exactly the 12 bytes starting at 0x100000594, so the first
## byte past the stub must not resolve.
# ADDR:      Looking up addresses in "{{.*\.yaml\.tmp\.gsym}}":
# ADDR-NEXT: 0x0000000100000560: main
# ADDR-NEXT: 0x0000000100000594: symbol stub for: puts
# ADDR-NEXT: 0x000000010000059f: symbol stub for: puts + 11
# ADDR-NEXT: 0x00000001000005a0: error: address 0x1000005a0 is not in GSYM

## The leading '_' is stripped from the "_puts" symbol name and the
## "symbol stub for: " prefix is added to it.
# DUMP:      String table:
# DUMP:      0x{{[0-9a-f]+}}: "symbol stub for: puts"
# DUMP:      FunctionInfo @ 0x{{[0-9a-f]+}}: [0x0000000100000594 - 0x00000001000005a0) "symbol stub for: puts"

