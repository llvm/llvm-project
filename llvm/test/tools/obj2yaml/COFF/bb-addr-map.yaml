          - BaseAddress: 0xFFFFFFFFFFFFFF20
            BBEntries:
              - ID:                 6
                AddressOffset:      0xA
                Size:               0xB
                Metadata:           0xC
                CallsiteEndOffsets: [ 0x1, 0x2 ]
                Hash:               0x123
symbols: []

## Check that obj2yaml uses the "SectionData" tag when the section is truncated
## or 'NumBlocks' or 'NumBBRanges' is invalid.
## The truncated section contains the first 8 bytes of document 1's section.

# RUN: yaml2obj --docnum=5 -DDATA=0300000000000000 %s -o %t5
# RUN: obj2yaml %t5 | FileCheck %s --check-prefixes=TRUNCATED,INVALID

# RUN: yaml2obj --docnum=1 -DNUMBLOCKS=2 %s -o %t6
# RUN: obj2yaml %t6 | FileCheck %s --check-prefixes=BADNUM,INVALID

# RUN: yaml2obj --docnum=1 -DNUMBBRANGES=2 %s -o %t7
# RUN: obj2yaml %t7 | FileCheck %s --check-prefixes=BADNUM,INVALID

# INVALID:        - Name:            .llvm_bb_addr_map
# INVALID-NEXT:     Characteristics: [ IMAGE_SCN_CNT_INITIALIZED_DATA, IMAGE_SCN_MEM_DISCARDABLE, IMAGE_SCN_MEM_READ ]
# BADNUM-NEXT:      SectionData:     {{([[:xdigit:]]+)}}{{$}}
# TRUNCATED-NEXT:   SectionData:     '0300000000000000'{{$}}
# INVALID-NEXT:     SizeOfRawData:   {{[0-9]+}}{{$}}

--- !COFF
header:
  Machine: IMAGE_FILE_MACHINE_AMD64
sections:
  - Name:            .llvm_bb_addr_map
    Characteristics: [ IMAGE_SCN_CNT_INITIALIZED_DATA, IMAGE_SCN_MEM_DISCARDABLE, IMAGE_SCN_MEM_READ ]
    SectionData:     "[[DATA]]"
symbols: []

## Check that obj2yaml can dump the function GUID in the .llvm_bb_addr_map section.

# RUN: yaml2obj --docnum=6 %s -o %t8
# RUN: obj2yaml %t8 | FileCheck %s --check-prefix=GUID

# GUID:      Entries:
# GUID-NEXT:   - Version:         6
# GUID-NEXT:     Feature:         0x100
# GUID-NEXT:     FuncGUID:        0x1122334455667788
# GUID-NEXT:     BBRanges:
# GUID-NEXT:       - BaseAddress:     0x20
# GUID-NEXT:         BBEntries:
# GUID-NEXT:           - ID:              0
# GUID-NEXT:             AddressOffset:   0x1
# GUID-NEXT:             Size:            0x2
# GUID-NEXT:             Metadata:        0x3
## The 'FuncGUID' field is omitted when the feature is disabled.
# GUID-NEXT:   - Version:         6
# GUID-NEXT:     BBRanges:
# GUID-NEXT:       - BaseAddress:     0x30
# GUID-NEXT:         BBEntries:
# GUID-NEXT:           - ID:              1
# GUID-NEXT:             AddressOffset:   0x4
# GUID-NEXT:             Size:            0x5
# GUID-NEXT:             Metadata:        0x6
# GUID-NEXT: symbols:

--- !COFF
header:
  Machine: IMAGE_FILE_MACHINE_AMD64
sections:
  - Name:            .llvm_bb_addr_map
    Characteristics: [ IMAGE_SCN_CNT_INITIALIZED_DATA, IMAGE_SCN_MEM_DISCARDABLE, IMAGE_SCN_MEM_READ ]
    Entries:
      - Version:  6
        Feature:  0x100
        FuncGUID: 0x1122334455667788
        BBRanges:
          - BaseAddress: 0x20
            BBEntries:
              - ID:            0
                AddressOffset: 0x1
                Size:          0x2
                Metadata:      0x3
      - Version:  6
        BBRanges:
          - BaseAddress: 0x30
            BBEntries:
              - ID:            1
                AddressOffset: 0x4
                Size:          0x5
                Metadata:      0x6
symbols: []

## Check that obj2yaml reports an error for an unsupported version or feature.

# RUN: yaml2obj --docnum=5 -DDATA=07 %s -o %t9
# RUN: not obj2yaml %t9 2>&1 | FileCheck %s --check-prefix=BAD-VERSION
# RUN: yaml2obj --docnum=5 -DDATA=050002 %s -o %t10
# RUN: not obj2yaml %t10 2>&1 | FileCheck %s --check-prefix=BAD-FEATURE

# BAD-VERSION: invalid .llvm_bb_addr_map section: invalid SHT_LLVM_BB_ADDR_MAP section version: 7
# BAD-FEATURE: invalid .llvm_bb_addr_map section: invalid encoding for BBAddrMap::Features: 0x200
