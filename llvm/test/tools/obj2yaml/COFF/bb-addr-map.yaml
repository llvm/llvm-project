## Check how obj2yaml produces YAML .llvm_bb_addr_map descriptions.

## Check that obj2yaml uses the "Entries" tag to describe an .llvm_bb_addr_map
## section, omits SectionData and SizeOfRawData and preserves relocations.
## Addresses are 8 bytes on 64-bit machines and 4 bytes on 32-bit machines.

# RUN: yaml2obj --docnum=1 %s -o %t1
# RUN: obj2yaml %t1 | FileCheck %s --check-prefixes=VALID,VALID64
# RUN: yaml2obj --docnum=1 -DMACHINE=IMAGE_FILE_MACHINE_I386 \
# RUN:   -DRELTYPE=IMAGE_REL_I386_DIR32 %s -o %t1.32
# RUN: obj2yaml %t1.32 | FileCheck %s --check-prefixes=VALID,VALID32

# VALID:        - Name:            .llvm_bb_addr_map
# VALID-NEXT:     Characteristics: [ IMAGE_SCN_CNT_INITIALIZED_DATA, IMAGE_SCN_MEM_DISCARDABLE, IMAGE_SCN_MEM_READ ]
# VALID-NEXT:     Entries:
# VALID-NEXT:       - Version:         3
## The 'Feature' and 'BaseAddress' fields are omitted when they are zero.
# VALID-NEXT:         BBRanges:
# VALID-NEXT:           - BBEntries:
# VALID-NEXT:               - ID:              0
# VALID-NEXT:                 AddressOffset:   0x1
# VALID-NEXT:                 Size:            0x2
# VALID-NEXT:                 Metadata:        0x3
# VALID-NEXT:               - ID:              2
# VALID-NEXT:                 AddressOffset:   0x4
# VALID-NEXT:                 Size:            0x5
# VALID-NEXT:                 Metadata:        0x6
# VALID-NEXT:               - ID:              4
# VALID-NEXT:                 AddressOffset:   0xFFFFFFFFFFFFFFF7
# VALID-NEXT:                 Size:            0xFFFFFFFFFFFFFFF8
# VALID-NEXT:                 Metadata:        0xFFFFFFFFFFFFFFF9
# VALID-NEXT:       - Version:         3
# VALID-NEXT:         Feature:         0x28
# VALID-NEXT:         BBRanges:
# VALID64-NEXT:         - BaseAddress:     0xFFFFFFFFFFFFFF20
# VALID32-NEXT:         - BaseAddress:     0xFFFFFF20
# VALID-NEXT:             BBEntries:
# VALID-NEXT:               - ID:              6
# VALID-NEXT:                 AddressOffset:   0xA
# VALID-NEXT:                 Size:            0xB
# VALID-NEXT:                 Metadata:        0xC
# VALID-NEXT:                 CallsiteEndOffsets: [ 0x1, 0x2 ]
# VALID-NEXT:     Relocations:
# VALID-NEXT:       - VirtualAddress:  2
# VALID-NEXT:         SymbolName:      .text
# VALID64-NEXT:       Type:            IMAGE_REL_AMD64_ADDR64
# VALID32-NEXT:       Type:            IMAGE_REL_I386_DIR32
# VALID-NEXT: symbols:

--- !COFF
header:
  Machine: [[MACHINE=IMAGE_FILE_MACHINE_AMD64]]
sections:
  - Name:            .text
    Characteristics: [ IMAGE_SCN_CNT_CODE, IMAGE_SCN_MEM_EXECUTE, IMAGE_SCN_MEM_READ ]
    SectionData:     C3
  - Name:            .llvm_bb_addr_map
    Characteristics: [ IMAGE_SCN_CNT_INITIALIZED_DATA, IMAGE_SCN_MEM_DISCARDABLE, IMAGE_SCN_MEM_READ ]
    Entries:
      - Version: 3
        Feature: 0x0
        BBRanges:
          - BaseAddress: 0x0
            BBEntries:
              - ID:            0
                AddressOffset: 0x1
                Size:          0x2
                Metadata:      0x3
              - ID:            2
                AddressOffset: 0x4
                Size:          0x5
                Metadata:      0x6
              - ID:            4
                AddressOffset: 0xFFFFFFFFFFFFFFF7
                Size:          0xFFFFFFFFFFFFFFF8
                Metadata:      0xFFFFFFFFFFFFFFF9
      - Version:     3
        Feature:     0x28
        NumBBRanges: [[NUMBBRANGES=<none>]]
        BBRanges:
          - BaseAddress: 0xFFFFFFFFFFFFFF20
            NumBlocks:   [[NUMBLOCKS=<none>]]
            BBEntries:
              - ID:                 6
                AddressOffset:      0xA
                Size:               0xB
                Metadata:           0xC
                CallsiteEndOffsets: [ 0x1, 0x2 ]
    Relocations:
      - VirtualAddress: 2
        SymbolName:     .text
        Type:           [[RELTYPE=IMAGE_REL_AMD64_ADDR64]]
symbols:
  - Name:          .text
    Value:         0
    SectionNumber: 1
    SimpleType:    IMAGE_SYM_TYPE_NULL
    ComplexType:   IMAGE_SYM_DTYPE_NULL
    StorageClass:  IMAGE_SYM_CLASS_STATIC

## Check obj2yaml can dump empty .llvm_bb_addr_map sections.

# RUN: yaml2obj --docnum=2 %s -o %t2
# RUN: obj2yaml %t2 | FileCheck %s --check-prefix=EMPTY

# EMPTY:      sections:
# EMPTY-NEXT:   - Name:            .llvm_bb_addr_map
# EMPTY-NEXT:     Characteristics: [ IMAGE_SCN_CNT_INITIALIZED_DATA, IMAGE_SCN_MEM_DISCARDABLE, IMAGE_SCN_MEM_READ ]
# EMPTY-NEXT: symbols:

--- !COFF
header:
  Machine: IMAGE_FILE_MACHINE_AMD64
sections:
  - Name:            .llvm_bb_addr_map
    Characteristics: [ IMAGE_SCN_CNT_INITIALIZED_DATA, IMAGE_SCN_MEM_DISCARDABLE, IMAGE_SCN_MEM_READ ]
    SectionData:     ""
symbols: []

## Check obj2yaml can dump multiple .llvm_bb_addr_map sections.

# RUN: yaml2obj --docnum=3 %s -o %t3
# RUN: obj2yaml %t3 | FileCheck %s --check-prefix=MULTI

# MULTI:      sections:
# MULTI-NEXT:   - Name:            .llvm_bb_addr_map
# MULTI-NEXT:     Characteristics: [ IMAGE_SCN_CNT_INITIALIZED_DATA, IMAGE_SCN_MEM_DISCARDABLE, IMAGE_SCN_MEM_READ ]
# MULTI-NEXT:     Entries:
## Fields 'BaseAddress' and 'Feature' are omitted when they are zero.
# MULTI-NEXT:       - Version:         0
# MULTI-NEXT:         BBRanges:
# MULTI-NEXT:           - BBEntries:
# MULTI-NEXT:               - ID:              0
# MULTI-NEXT:                 AddressOffset:   0x1
# MULTI-NEXT:                 Size:            0x2
# MULTI-NEXT:                 Metadata:        0x3
# MULTI-NEXT:   - Name:            .llvm_bb_addr_map
# MULTI-NEXT:     Characteristics: [ IMAGE_SCN_CNT_INITIALIZED_DATA, IMAGE_SCN_MEM_DISCARDABLE, IMAGE_SCN_MEM_READ ]
# MULTI-NEXT:     Entries:
# MULTI-NEXT:       - Version:         0
# MULTI-NEXT:         BBRanges:
# MULTI-NEXT:           - BaseAddress:     0x20
# MULTI-NEXT:             BBEntries:       []
# MULTI-NEXT: symbols:

--- !COFF
header:
  Machine: IMAGE_FILE_MACHINE_AMD64
sections:
  - Name:            .llvm_bb_addr_map
    Characteristics: [ IMAGE_SCN_CNT_INITIALIZED_DATA, IMAGE_SCN_MEM_DISCARDABLE, IMAGE_SCN_MEM_READ ]
    Entries:
      - Version: 0
        Feature: 0x0
        BBRanges:
          - BaseAddress: 0x0
            BBEntries:
              - AddressOffset: 0x1
                Size:          0x2
                Metadata:      0x3
  - Name:            .llvm_bb_addr_map
    Characteristics: [ IMAGE_SCN_CNT_INITIALIZED_DATA, IMAGE_SCN_MEM_DISCARDABLE, IMAGE_SCN_MEM_READ ]
    Entries:
      - Version: 0
        BBRanges:
          - BaseAddress: 0x20
symbols: []

