## Check that for a linked image, only the range of .pdata described by the
## exception directory is decoded. Here .pdata is 16 bytes long (for example,
## because other data was merged into it with /merge), but the exception
## directory only covers one entry. The other 8 bytes are not a valid
## RUNTIME_FUNCTION and must not be decoded.

## The function table is at the start of .pdata, followed by other data.
# RUN: yaml2obj %s -o %t1.exe -DRVA=8192 \
# RUN:   -DPDATA=00100000050000000010000000300000
# RUN: llvm-readobj --unwind %t1.exe | FileCheck %s

## The function table is at the end of .pdata, preceded by other data.
# RUN: yaml2obj %s -o %t2.exe -DRVA=8200 \
# RUN:   -DPDATA=00100000003000000010000005000000
# RUN: llvm-readobj --unwind %t2.exe | FileCheck %s

## The exception directory extends past the end of .pdata. Only the part of
## it that lies inside the section is decoded.
# RUN: yaml2obj %s -o %t3.exe -DRVA=8200 -DSIZE=64 \
# RUN:   -DPDATA=00100000003000000010000005000000
# RUN: llvm-readobj --unwind %t3.exe | FileCheck %s

# CHECK:      UnwindInformation [
# CHECK-NEXT:   RuntimeFunction {
# CHECK-NEXT:     Function: main (0x140001000)
# CHECK-NEXT:     Fragment: No
# CHECK-NEXT:     FunctionLength: 4
# CHECK:        }
# CHECK-NEXT: ]

## The exception directory does not start inside .pdata. The whole section is
## decoded, as for an object file.
# RUN: yaml2obj %s -o %t4.exe -DRVA=4096 \
# RUN:   -DPDATA=00100000050000000010000005000000
# RUN: llvm-readobj --unwind %t4.exe | FileCheck %s --check-prefix=FALLBACK

# FALLBACK:      UnwindInformation [
# FALLBACK-NEXT:   RuntimeFunction {
# FALLBACK-NEXT:     Function: main (0x140001000)
# FALLBACK:        }
# FALLBACK-NEXT:   RuntimeFunction {
# FALLBACK-NEXT:     Function: main (0x140001000)
# FALLBACK:        }
# FALLBACK-NEXT: ]

--- !COFF
OptionalHeader:
  AddressOfEntryPoint: 4096
  ImageBase:       5368709120
  SectionAlignment: 4096
  FileAlignment:   512
  MajorOperatingSystemVersion: 6
  MinorOperatingSystemVersion: 0
  MajorImageVersion: 0
  MinorImageVersion: 0
  MajorSubsystemVersion: 6
  MinorSubsystemVersion: 0
  Subsystem:       IMAGE_SUBSYSTEM_WINDOWS_CUI
  DLLCharacteristics: [ ]
  SizeOfStackReserve: 1048576
  SizeOfStackCommit: 4096
  SizeOfHeapReserve: 1048576
  SizeOfHeapCommit: 4096
  ExceptionTable:
    RelativeVirtualAddress: [[RVA]]
    Size:            [[SIZE=8]]
header:
  Machine:         IMAGE_FILE_MACHINE_ARM64
  Characteristics: [ IMAGE_FILE_EXECUTABLE_IMAGE, IMAGE_FILE_LARGE_ADDRESS_AWARE ]
sections:
  - Name:            .text
    Characteristics: [ IMAGE_SCN_CNT_CODE, IMAGE_SCN_MEM_EXECUTE, IMAGE_SCN_MEM_READ ]
    VirtualAddress:  4096
    VirtualSize:     4
    SectionData:     C0035FD6
  - Name:            .pdata
    Characteristics: [ IMAGE_SCN_CNT_INITIALIZED_DATA, IMAGE_SCN_MEM_READ ]
    VirtualAddress:  8192
    VirtualSize:     16
    ## The function table entry is for main, with packed unwind data
    ## (Flag=1, FunctionLength=4). The other data, which is not part of the
    ## function table, is the RVA of main and the RVA of a 4-byte object in
    ## .rdata.
    SectionData:     [[PDATA]]
  - Name:            .rdata
    Characteristics: [ IMAGE_SCN_CNT_INITIALIZED_DATA, IMAGE_SCN_MEM_READ ]
    VirtualAddress:  12288
    VirtualSize:     4
    SectionData:     '00000000'
symbols:
  - Name:            main
    Value:           0
    SectionNumber:   1
    SimpleType:      IMAGE_SYM_TYPE_NULL
    ComplexType:     IMAGE_SYM_DTYPE_FUNCTION
    StorageClass:    IMAGE_SYM_CLASS_EXTERNAL
...
