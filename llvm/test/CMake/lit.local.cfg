import os

import lit.util

# These tests run the CMake that configured the build. It may not be available
# where the tests run, e.g. when a cross-compiled LLVM is tested on the target.
if not os.path.exists(config.host_cmake):
    config.unsupported = True

config.substitutions.append(("%cmake", "'%s'" % config.host_cmake))

clang_module = os.path.join(
    config.llvm_src_root, "..", "clang", "cmake", "modules", "AddClang.cmake"
)
if os.path.exists(clang_module):
    config.available_features.add("clang-source-cmake")

if all(lit.util.which(tool, config.environment["PATH"]) for tool in ("ninja", "cl", "rc")):
    config.available_features.add("cmake-msvc")
