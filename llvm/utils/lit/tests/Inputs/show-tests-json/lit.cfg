import lit.formats


class AnnotatedShTest(lit.formats.ShTest):
    def getTestsForPath(self, testSuite, path_in_suite, litConfig, localConfig):
        for test in super().getTestsForPath(testSuite, path_in_suite, litConfig, localConfig):
            if path_in_suite[-1] == "known.test":
                test.requires.append("preexisting")
                test.unsupported.append("disabled")
                test.xfails.append("old-xfail")
            yield test


config.name = "json-inventory"
config.suffixes = [".test"]
config.test_format = AnnotatedShTest()
