import lit.formats

# Verify that the site configuration was loaded.
if config.test_source_root is None or config.test_exec_root is None:
    lit_config.fatal("No site specific configuration")

# config.name is set here, i.e. after the site config has already run, so
# --test-output-root must pick up this name rather than a placeholder.
config.name = "output-root-site-suite"
config.suffixes = [".txt"]
config.test_format = lit.formats.ShTest()
