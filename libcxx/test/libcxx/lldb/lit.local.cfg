# The tests in this directory drive LLDB to exercise the libc++ data
# formatters, so they all share the same requirements.
_required_features = [
  # The formatters themselves are Python.
  "host-has-lldb-with-python",
  "has-filecheck",
  "has-splitfile",
  # The formatters read type layouts out of debug info, which optimized
  # builds are free to drop.
  "optimization=none",
]

if any(f not in config.available_features for f in _required_features):
  config.unsupported = True

if "c++03" in config.available_features:
  config.unsupported = True
