# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.10"
  jobs:
    post_checkout:
      - mkdir -p _readthedocs/html
      - mkdir staticpages
      - wget -P staticpages https://repo.radeon.com/rocm/apt/7.2.4/pool/main/r/rocm-llvm-docs/rocm-llvm-docs_22.0.0.26084.70204-93~22.04_amd64.deb --no-check-certificate
      - dpkg-deb -x staticpages/rocm-llvm-docs_22.0.0.26084.70204-93~22.04_amd64.deb staticpages
      - mv staticpages/opt/rocm-7.2.4/share/doc/rocm-llvm-docs/LLVM _readthedocs/html
    post_build:
      - rm -rf staticpages

python:
  install:
  - requirements: amd/docs/sphinx/requirements.txt

sphinx:
  configuration: amd/docs/conf.py

formats: [htmlzip]
