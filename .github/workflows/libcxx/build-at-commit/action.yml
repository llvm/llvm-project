# This composite action builds libc++ as of an arbitrary commit and installs it into the
# specified directory.
#
# This allows other workflows to reuse this job for various purposes.
#
# This action assumes that the monorepo has been checked out with its full history (arbitrary
# historical commits must be reachable) and that CMake, Ninja and the compiler are available.

name: 'Build libc++ at a commit'
description: 'Build and install libc++ as of the given commit.'

inputs:
  commit:
    description: 'The libc++ commit to build.'
    required: true
  install-dir:
    description: 'Directory to install the library into.'
    required: true
  compiler:
    description: 'The C++ compiler to build the library with.'
    required: true
  cmake-cache:
    description: >-
      CMake cache describing how to build the library, as a path relative to the root of the
      monorepo (e.g. libcxx/utils/ci/lnt/cmake/generic.cmake).
    required: true

runs:
  using: composite
  steps:
    - name: Build libc++ at ${{ inputs.commit }}
      shell: bash
      env:
        CMAKE_CACHE: ${{ inputs.cmake-cache }}
        COMMIT: ${{ inputs.commit }}
        COMPILER: ${{ inputs.compiler }}
        INSTALL_DIR: ${{ inputs.install-dir }}
      run: |
        # Clean up any stale install directory
        rm -rf "${INSTALL_DIR}"

        # Let build-at-commit use (and clean up) its own temporary source and build directories:
        # only the installation is of interest to the caller.
        libcxx/utils/build-at-commit                       \
          --commit "${COMMIT}"                             \
          --install-dir "${INSTALL_DIR}"                   \
          --                                               \
          -DCMAKE_CXX_COMPILER="${COMPILER}"               \
          -C "${GITHUB_WORKSPACE}/${CMAKE_CACHE}"
