name: HLSL Test

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      OffloadTest-branch:
        description: 'Test Suite Branch'
        required: false
        default: 'main'
        type: string
      SKU:
        required: true
        type: string
      TestTarget:
        required: false
        default: 'check-hlsl'
        type: string

jobs:
  build:
    runs-on: ${{ inputs.SKU }}
    env:
      VsDevShell: 'Microsoft Visual Studio\2022\Community\Common7\Tools\Launch-VsDevShell.ps1'
    steps:
      - name: Checkout DXC
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: Microsoft/DirectXShaderCompiler
          ref: main
          path: DXC
          submodules: true
      - name: Checkout LLVM
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: llvm-project
      - name: Checkout OffloadTest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: llvm/offload-test-suite
          ref: main
          path: OffloadTest
      - name: Checkout Golden Images
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: llvm/offload-golden-images
          ref: main
          path: golden-images
      - name: Build DXC
        run: |
            & $env:ProgramFiles\$env:VsDevShell -Arch amd64
            cd DXC
            mkdir build
            cd build
            cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -C ${{ github.workspace }}/DXC/cmake/caches/PredefinedParams.cmake -C ${{ github.workspace }}/OffloadTest/cmake/caches/sccache.cmake -DHLSL_DISABLE_SOURCE_GENERATION=On ${{ github.workspace }}/DXC/
            ninja dxv llvm-dis
      - name: Build LLVM
        run: |
            & $env:ProgramFiles\$env:VsDevShell -Arch amd64
            cd llvm-project
            mkdir build
            cd build
            cmake -G Ninja -DDXIL_DIS=${{ github.workspace }}/DXC/build/bin/llvm-dis.exe -DLLVM_INCLUDE_DXIL_TESTS=On -DCMAKE_BUILD_TYPE=Release -C ${{ github.workspace }}/llvm-project/clang/cmake/caches/HLSL.cmake -C ${{ github.workspace }}/OffloadTest/cmake/caches/sccache.cmake -DDXC_DIR=${{ github.workspace }}/DXC/build/bin -DLLVM_EXTERNAL_OFFLOADTEST_SOURCE_DIR=${{ github.workspace }}/OffloadTest -DLLVM_EXTERNAL_PROJECTS="OffloadTest" -DLLVM_LIT_ARGS="--xunit-xml-output=testresults.xunit.xml -v" -DOFFLOADTEST_WARP_ONLY=On -DGOLDENIMAGE_DIR=${{ github.workspace }}/golden-images ${{ github.workspace }}/llvm-project/llvm/
            ninja llc llvm-objcopy FileCheck hlsl-test-depends
      - name: Run HLSL Tests
        run: |
            & $env:ProgramFiles\$env:VsDevShell -Arch amd64
            cd llvm-project
            cd build
            ninja check-llvm-tools-dxil-dis
            ninja check-hlsl-unit
            ninja ${{ inputs.TestTarget }}
