name: HLSL Test

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      OffloadTest-branch:
        description: 'Test Suite Branch'
        required: false
        default: 'main'
        type: string
      SKU:
        required: true
        type: string
      TestTarget:
        required: false
        default: 'check-hlsl'
        type: string

jobs:
  build:
    runs-on: ${{ inputs.SKU }}
    env:
      DXC_VERSION: 1.9.2607.13
    steps:
      - name: Setup Windows
        if: runner.os == 'Windows'
        uses: llvm/actions/setup-windows@89a8cf80982d830faab019237860b344a6390c30 # main
        with:
          arch: amd64
      - name: Checkout LLVM
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: llvm-project
      - name: Checkout OffloadTest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: llvm/offload-test-suite
          ref: main
          path: OffloadTest
      - name: Checkout Golden Images
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: llvm/offload-golden-images
          ref: main
          path: golden-images
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.x'
      - name: Install test dependencies
        run: python -m pip install -r OffloadTest/test/requirements.txt
      - name: Download DXC validator
        run: |
            nuget install Microsoft.Direct3D.DXC -Version $env:DXC_VERSION -OutputDirectory DXC -ExcludeVersion -NonInteractive
            $dxcDir = "${{ github.workspace }}/DXC/Microsoft.Direct3D.DXC/build/native/bin/x64"
            foreach ($file in @("dxv.exe", "dxcompiler.dll", "dxil.dll")) {
              if (-not (Test-Path "$dxcDir/$file")) {
                throw "$file was not found in Microsoft.Direct3D.DXC $env:DXC_VERSION"
              }
            }
            $dxcDir = $dxcDir.Replace('\', '/')
            "DXC_DIR=$dxcDir" >> $env:GITHUB_ENV
            $dxcDir >> $env:GITHUB_PATH
      - name: Build LLVM
        run: |
            cd llvm-project
            mkdir build
            cd build
            cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DLLVM_USE_LINKER=lld -C ${{ github.workspace }}/llvm-project/clang/cmake/caches/HLSL.cmake -DDXC_DIR=$env:DXC_DIR -DLLVM_EXTERNAL_OFFLOADTEST_SOURCE_DIR=${{ github.workspace }}/OffloadTest -DLLVM_EXTERNAL_PROJECTS="OffloadTest" -DLLVM_LIT_ARGS="--xunit-xml-output=testresults.xunit.xml -v" -DOFFLOADTEST_WARP_ONLY=On -DGOLDENIMAGE_DIR=${{ github.workspace }}/golden-images ${{ github.workspace }}/llvm-project/llvm/
            ninja hlsl-test-depends
      - name: Run HLSL Tests
        run: |
            cd llvm-project
            cd build
            ninja check-hlsl-unit
            ninja ${{ inputs.TestTarget }}
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action/windows@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        if: always() && runner.os == 'Windows'
        continue-on-error: true
        with:
          comment_mode: off
          files: llvm-project/build/**/testresults.xunit.xml
