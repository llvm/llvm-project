# Linux variant of the SPIRV CI: builds LLVM/Clang/translator/Comgr in
# one job and runs SPIRV-relevant test suites in parallel test jobs that
# consume a GHA artifact uploaded by the build job.

name: SPIRV Compiler CI - Linux - amd-staging

on:
  workflow_call:

permissions:
  contents: read

env:
  LLVM_BUILD: build
  DEVLIBS_BUILD: build-device-libs
  COMGR_BUILD: build-comgr
  ROCR_BUILD: build-rocr
  CLR_BUILD: build-clr
  ROCPRIM_BUILD: build-rocprim
  HIPCUB_BUILD: build-hipcub
  ROCTHRUST_BUILD: build-rocthrust
  ROCRAND_BUILD: build-rocrand
  HIPRAND_BUILD: build-hiprand
  STAGING: staging
  TRANSLATOR_SRC: llvm-project/llvm/projects/SPIRV-LLVM-Translator

jobs:
  # =====================================================================
  # Build LLVM + Clang + amd-llvm-spirv + device-libs + Comgr.
  # Upload full build trees for compiler tests and a smaller compiler/runtime
  # bundle for the GPU tests.
  # =====================================================================
  build:
    name: Build
    outputs:
      translator_sha: ${{ steps.resolve_translator.outputs.sha }}
    runs-on: aws-linux-scale-rocm-large
    timeout-minutes: 120
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:34ac4cb83216f760d8132ec2fabed4062f8c1fe40c94c70f58e8d7f8a7931ada
    steps:
      # ---- Checkout ---------------------------------------------------------
      # llvm-project at PR head (this repo) provides LLVM/Clang/LLD + amd/
      # subprojects (device-libs, comgr). The SPIRV translator is pinned to
      # amd-staging and overlaid in-tree under llvm/projects/.
      - name: Checkout llvm-project (PR head)
        # On pull_request events: PR head from the (possibly fork) head repo.
        # On workflow_dispatch: the branch the dispatch was on.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: llvm-project
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout SPIRV-LLVM-Translator (amd-staging)
        # Pinned to amd-staging because llvm-project PRs don't change
        # the translator. Without an explicit repository/ref, checkout
        # defaults to the workflow's own repo (llvm-project) and clobbers
        # the translator path with llvm-project content.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ROCm/SPIRV-LLVM-Translator
          ref: amd-staging
          path: ${{ env.TRANSLATOR_SRC }}
          fetch-depth: 1
          persist-credentials: false

      # ---- Build LLVM + Clang + LLD + in-tree SPIRV translator --------------
      - name: Resolve translator SHA
        id: resolve_translator
        run: echo "sha=$(git -C llvm-project/llvm/projects/SPIRV-LLVM-Translator rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate translator test driver
        run: python llvm-project/.github/scripts/test_spirv_ci_lit.py

      - name: Configure LLVM
        run: |
          cmake -G Ninja -S llvm-project/llvm -B "$LLVM_BUILD" \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_TARGETS_TO_BUILD="AMDGPU;X86;SPIRV" \
            -DLLVM_INCLUDE_TESTS=ON \
            -DLLVM_INSTALL_GTEST=ON \
            -DLLVM_ENABLE_RUNTIMES="compiler-rt" \
            -DCOMPILER_RT_BUILD_BUILTINS=ON \
            -DLLVM_LIT_ARGS="-sv --no-progress-bar"

      - name: Build LLVM + Clang + amd-llvm-spirv + test deps
        # *-test-depends pull in all tools needed for lit (FileCheck, not,
        # llc, llvm-*, clang, opt, etc.) and stay current with upstream.
        run: ninja -C "$LLVM_BUILD" llvm-test-depends clang-test-depends amd-llvm-spirv builtins

      # ---- Build device-libs (standalone, against built LLVM) --------------
      - name: Configure device-libs
        run: |
          cmake -G Ninja -S llvm-project/amd/device-libs -B "$DEVLIBS_BUILD" \
            -DCMAKE_PREFIX_PATH=$PWD/$LLVM_BUILD \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DLLVM_DIR=$PWD/$LLVM_BUILD/lib/cmake/llvm

      - name: Build device-libs
        run: ninja -C "$DEVLIBS_BUILD"

      # ---- Build Comgr (standalone, against built LLVM + device-libs) ------
      - name: Configure Comgr
        # LLVM_EXTERNAL_SPIRV_LLVM_TRANSLATOR_SOURCE_DIR points Comgr at
        # the in-tree translator headers so COMGR_SPIRV_TRANSLATOR_AVAILABLE
        # turns ON (otherwise translator-dependent lit tests are UNSUPPORTED).
        run: |
          cmake -G Ninja -S llvm-project/amd/comgr -B "$COMGR_BUILD" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_PREFIX_PATH="$PWD/$LLVM_BUILD;$PWD/$DEVLIBS_BUILD" \
            -DLLVM_DIR=$PWD/$LLVM_BUILD/lib/cmake/llvm \
            -DLLVM_EXTERNAL_SPIRV_LLVM_TRANSLATOR_SOURCE_DIR=$PWD/$TRANSLATOR_SRC \
            -DBUILD_TESTING=ON

      - name: Build Comgr
        run: ninja -C "$COMGR_BUILD" amd_comgr

      - name: Install build deps for runtime build
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            numactl-devel elfutils-libelf-devel libdrm-devel

      - name: Install comgr + device-libs into staging
        run: |
          cmake --install "$COMGR_BUILD" --prefix $PWD/$STAGING
          cmake --install "$DEVLIBS_BUILD" --prefix $PWD/$STAGING

      - name: Checkout rocm-systems
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ROCm/rocm-systems
          ref: develop
          path: rocm-systems
          persist-credentials: false

      - name: Checkout rocm-cmake
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ROCm/rocm-cmake
          ref: develop
          path: rocm-cmake
          persist-credentials: false

      - name: Configure ROCR-Runtime
        run: |
          cmake -G Ninja -S rocm-systems/projects/rocr-runtime -B "$ROCR_BUILD" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=$PWD/$LLVM_BUILD/bin/clang \
            -DCMAKE_CXX_COMPILER=$PWD/$LLVM_BUILD/bin/clang++ \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_INSTALL_PREFIX=$PWD/$STAGING \
            -DLLVM_DIR=$PWD/$LLVM_BUILD/lib/cmake/llvm \
            -DClang_DIR=$PWD/$LLVM_BUILD/lib/cmake/clang

      - name: Build ROCR-Runtime
        env:
          ROCM_PATH: ${{ github.workspace }}/${{ env.STAGING }}
        run: ninja -C "$ROCR_BUILD" install

      - name: Configure CLR (HIP runtime)
        run: |
          cmake -G Ninja -S rocm-systems/projects/clr -B "$CLR_BUILD" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=$PWD/$LLVM_BUILD/bin/clang \
            -DCMAKE_CXX_COMPILER=$PWD/$LLVM_BUILD/bin/clang++ \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_INSTALL_PREFIX=$PWD/$STAGING \
            -DCMAKE_PREFIX_PATH="$PWD/$STAGING;$PWD/$LLVM_BUILD;$PWD/rocm-cmake/share/rocm" \
            -DHIP_PLATFORM=amd \
            -DHIP_COMMON_DIR=$PWD/rocm-systems/projects/hip \
            -DCLR_BUILD_HIP=ON \
            -DROCM_KPACK_ENABLED=OFF \
            -DHIP_ENABLE_ROCPROFILER_REGISTER=OFF

      - name: Build CLR
        run: ninja -C "$CLR_BUILD" install

      - name: Stage translator binary for runtime SPIRV JIT
        run: |
          mkdir -p "$STAGING/bin"
          cp -a "$LLVM_BUILD/bin/amd-llvm-spirv" "$STAGING/bin/"

      # test_hecbench compiles with hipcc.
      - name: Build and stage hipcc
        run: |
          cmake -G Ninja -S llvm-project/amd/hipcc -B build-hipcc \
            -DCMAKE_BUILD_TYPE=Release
          ninja -C build-hipcc hipcc
          mkdir -p "$STAGING/bin"
          cp -a build-hipcc/hipcc "$STAGING/bin/hipcc"

      # Create hipconfig script for rocPRIM/hipCUB detection.
      - name: Create hipconfig script
        run: |
          mkdir -p "$STAGING/bin"
          cat > "$STAGING/bin/hipconfig" << 'EOF'
          #!/bin/bash
          case "$1" in
            --platform) echo "amd" ;;
            --compiler) echo "clang" ;;
            --runtime) echo "rocclr" ;;
            --hipclangpath) echo "$PWD/$LLVM_BUILD/bin" ;;
            *) echo "amd" ;;
          esac
          EOF
          chmod +x "$STAGING/bin/hipconfig"

      # Build rocPRIM.
      - name: Checkout rocPRIM
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ROCm/rocPRIM
          ref: develop
          path: rocPRIM
          persist-credentials: false

      - name: Configure and install rocPRIM
        run: |
          export PATH=$PWD/$STAGING/bin:$PATH
          cmake -G Ninja -S rocPRIM -B "$ROCPRIM_BUILD" \
            -DCMAKE_CXX_COMPILER=$PWD/$LLVM_BUILD/bin/clang++ \
            -DCMAKE_HIP_COMPILER=$PWD/$LLVM_BUILD/bin/clang++ \
            -DCMAKE_PREFIX_PATH="$PWD/$STAGING;$PWD/$LLVM_BUILD" \
            -DCMAKE_INSTALL_PREFIX=$PWD/$STAGING \
            -DBUILD_TEST=OFF \
            -DBUILD_BENCHMARK=OFF
          ninja -C "$ROCPRIM_BUILD"
          cmake --install "$ROCPRIM_BUILD" --prefix $PWD/$STAGING

      # Build hipCUB.
      - name: Checkout hipCUB
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ROCm/hipCUB
          ref: develop
          path: hipCUB
          persist-credentials: false

      - name: Configure and install hipCUB
        run: |
          cmake -G Ninja -S hipCUB -B "$HIPCUB_BUILD" \
            -DCMAKE_CXX_COMPILER=$PWD/$LLVM_BUILD/bin/clang++ \
            -DCMAKE_HIP_COMPILER=$PWD/$LLVM_BUILD/bin/clang++ \
            -DCMAKE_PREFIX_PATH="$PWD/$STAGING;$PWD/$LLVM_BUILD" \
            -DCMAKE_INSTALL_PREFIX=$PWD/$STAGING \
            -DBUILD_TEST=OFF \
            -DBUILD_BENCHMARK=OFF
          ninja -C "$HIPCUB_BUILD"
          cmake --install "$HIPCUB_BUILD" --prefix $PWD/$STAGING

      # Build rocThrust (header-only; supplies thrust:: iterators to examples).
      - name: Checkout rocThrust
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ROCm/rocThrust
          ref: develop
          path: rocThrust
          persist-credentials: false

      - name: Configure and install rocThrust
        run: |
          cmake -G Ninja -S rocThrust -B "$ROCTHRUST_BUILD" \
            -DCMAKE_CXX_COMPILER=$PWD/$LLVM_BUILD/bin/clang++ \
            -DCMAKE_HIP_COMPILER=$PWD/$LLVM_BUILD/bin/clang++ \
            -DCMAKE_PREFIX_PATH="$PWD/$STAGING;$PWD/$LLVM_BUILD" \
            -DCMAKE_INSTALL_PREFIX=$PWD/$STAGING \
            -DBUILD_TEST=OFF \
            -DBUILD_BENCHMARK=OFF
          ninja -C "$ROCTHRUST_BUILD"
          cmake --install "$ROCTHRUST_BUILD" --prefix $PWD/$STAGING

      # Build rocRAND.
      - name: Checkout rocRAND
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ROCm/rocRAND
          ref: develop
          path: rocRAND
          persist-credentials: false

      - name: Configure and build rocRAND
        env:
          ROCM_PATH: ${{ github.workspace }}/${{ env.STAGING }}
        run: |
          cmake -G Ninja -S rocRAND -B "$ROCRAND_BUILD" \
            -DCMAKE_CXX_COMPILER=$PWD/$LLVM_BUILD/bin/clang++ \
            -DCMAKE_HIP_COMPILER=$PWD/$LLVM_BUILD/bin/clang++ \
            -DCMAKE_PREFIX_PATH="$PWD/$STAGING;$PWD/$LLVM_BUILD" \
            -DCMAKE_INSTALL_PREFIX=$PWD/$STAGING \
            -DAMDGPU_TARGETS="gfx942;amdgcnspirv" \
            -DBUILD_TEST=OFF \
            -DBUILD_BENCHMARK=OFF \
            -DCMAKE_HIP_FLAGS="--rocm-path=$PWD/$STAGING"
          ninja -C "$ROCRAND_BUILD"
          cmake --install "$ROCRAND_BUILD" --prefix $PWD/$STAGING

      # Build hipRAND.
      - name: Checkout hipRAND
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ROCm/hipRAND
          ref: develop
          path: hipRAND
          persist-credentials: false

      - name: Configure and build hipRAND
        env:
          ROCM_PATH: ${{ github.workspace }}/${{ env.STAGING }}
        run: |
          cmake -G Ninja -S hipRAND -B "$HIPRAND_BUILD" \
            -DCMAKE_CXX_COMPILER=$PWD/$LLVM_BUILD/bin/clang++ \
            -DCMAKE_PREFIX_PATH="$PWD/$STAGING;$PWD/$LLVM_BUILD" \
            -DCMAKE_INSTALL_PREFIX=$PWD/$STAGING \
            -DBUILD_TEST=OFF \
            -DBUILD_BENCHMARK=OFF \
            -DROCRAND_PATH=$PWD/$STAGING
          ninja -C "$HIPRAND_BUILD"
          cmake --install "$HIPRAND_BUILD" --prefix $PWD/$STAGING

      # The build image has libnuma from numactl-devel. Bundle it for ROCR so
      # GPU jobs do not need to contact package repositories at test time.
      - name: Stage libnuma
        run: cp -L /usr/lib64/libnuma.so.1 "$STAGING/lib/libnuma.so.1"

      # ---- Strip + upload artifacts ----------------------------------------
      # Strip binaries to keep the artifact under GHA's 10GB cap and shorten
      # upload/download time. Tests don't need debug symbols. `--strip-unneeded`
      # preserves dynamic symbols needed at link/load time.
      - name: Strip binaries
        run: |
          find "$LLVM_BUILD" "$COMGR_BUILD" "$DEVLIBS_BUILD" "$ROCR_BUILD" "$CLR_BUILD" \
            "$ROCPRIM_BUILD" "$HIPCUB_BUILD" "$ROCTHRUST_BUILD" "$ROCRAND_BUILD" "$HIPRAND_BUILD" "$STAGING" \
            -type f \( -executable -o -name '*.so*' -o -name '*.a' \) \
            -exec strip --strip-unneeded {} + 2>/dev/null || true

      # Tar before upload: actions/upload-artifact@v4 strips +x bits and
      # excludes hidden files (loses FetchContent .git dirs).
      - name: Stage translator test driver
        run: cp llvm-project/.github/scripts/spirv_ci_lit.py build/spirv_ci_lit.py

      - name: Tar build trees
        run: |
          tar -cf linux-build-tree.tar \
            "$LLVM_BUILD" "$COMGR_BUILD" "$DEVLIBS_BUILD" "$ROCR_BUILD" "$CLR_BUILD" \
            "$ROCPRIM_BUILD" "$HIPCUB_BUILD" "$ROCTHRUST_BUILD" "$ROCRAND_BUILD" "$HIPRAND_BUILD" "$STAGING"

      - name: Upload build tree artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: linux-build-tree
          path: linux-build-tree.tar
          retention-days: 1
          compression-level: 6
          if-no-files-found: error

      # These jobs compile HIP programs but never rebuild LLVM or the runtime.
      # Dereference aliases such as clang++ and ld.lld; tar stores shared inodes
      # as hard links, so the bundle has no dangling links or duplicate binaries.
      - name: Tar GPU compiler and runtime
        run: |
          tar --dereference -cf linux-gpu-runtime.tar \
            "$LLVM_BUILD/lib/clang" "$STAGING" \
            "$LLVM_BUILD/bin/clang" "$LLVM_BUILD/bin/clang++" \
            "$LLVM_BUILD/bin/clang-linker-wrapper" \
            "$LLVM_BUILD/bin/clang-offload-bundler" \
            "$LLVM_BUILD/bin/llvm-offload-binary" \
            "$LLVM_BUILD/bin/lld" "$LLVM_BUILD/bin/ld.lld" \
            "$LLVM_BUILD/bin/llvm-ar" "$LLVM_BUILD/bin/llvm-ranlib" \
            "$LLVM_BUILD/bin/llvm-link" "$LLVM_BUILD/bin/llvm-nm" \
            "$LLVM_BUILD/bin/llvm-objcopy" "$LLVM_BUILD/bin/llvm-objdump" \
            "$LLVM_BUILD/bin/llvm-readobj" "$LLVM_BUILD/bin/llvm-readelf" \
            "$LLVM_BUILD/bin/llvm-dis" "$LLVM_BUILD/bin/llvm-mc" \
            "$LLVM_BUILD/bin/amd-llvm-spirv"

      - name: Upload GPU compiler and runtime
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: linux-gpu-runtime
          path: linux-gpu-runtime.tar
          retention-days: 1
          compression-level: 6
          if-no-files-found: error

  # =====================================================================
  # Test - SPIRV translator lit (with PR-head vs amd-staging baseline diff)
  # =====================================================================
  # Non-blocking: upstream Khronos breaks ~1 translator lit test per week
  # (spirv-val drift, LLVM IR changes vs DebugInfo tests, DCE). Their fixes
  # typically land within a day; our daily upstream-merge cron pulls them
  # in. Blocking here would gate unrelated PRs during those windows. The
  # baseline run partitions failures into new / fixed / pre-existing so
  # AMD-side regressions stay visible.
  test_translator_lit:
    name: Test SPIRV translator lit
    needs: build
    runs-on: aws-linux-scale-rocm-large
    timeout-minutes: 30
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:34ac4cb83216f760d8132ec2fabed4062f8c1fe40c94c70f58e8d7f8a7931ada
    permissions:
      contents: read

    steps:
      - name: Checkout llvm-project (PR head)
        # On pull_request events: PR head from the (possibly fork) head repo.
        # On workflow_dispatch: the branch the dispatch was on.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: llvm-project
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout SPIRV-LLVM-Translator (amd-staging)
        # Pinned to amd-staging because llvm-project PRs don't change
        # the translator. Without an explicit repository/ref, checkout
        # defaults to the workflow's own repo (llvm-project) and clobbers
        # the translator path with llvm-project content.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ROCm/SPIRV-LLVM-Translator
          ref: ${{ needs.build.outputs.translator_sha }}
          path: ${{ env.TRANSLATOR_SRC }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download build tree artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: linux-build-tree

      - name: Untar build trees
        run: |
          tar -xmf linux-build-tree.tar

      # Invoke lit directly: Ninja would rebuild tools after artifact extraction.
      - name: Test - SPIRV Translator [PR head]
        id: translator_tests
        run: >-
          python build/spirv_ci_lit.py --build-dir build
          --results build/spirv-pr.json

      - name: Switch llvm-project to amd-staging for baseline
        if: steps.translator_tests.outputs.has_failures == 'true'
        run: |
          cd llvm-project
          git fetch --depth=1 https://github.com/ROCm/llvm-project.git amd-staging
          git checkout FETCH_HEAD

      - name: Build and test baseline, rejecting new translator failures
        if: steps.translator_tests.outputs.has_failures == 'true'
        run: >-
          python build/spirv_ci_lit.py --build-dir build --rebuild
          --results build/spirv-baseline.json --pr-results build/spirv-pr.json

  # =====================================================================
  # Test - LLVM SPIRV codegen lit suite
  # =====================================================================
  test_codegen:
    name: Test LLVM SPIRV codegen
    needs: build
    runs-on: aws-linux-scale-rocm-large
    timeout-minutes: 15
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:34ac4cb83216f760d8132ec2fabed4062f8c1fe40c94c70f58e8d7f8a7931ada

    steps:
      - name: Checkout llvm-project (PR head)
        # On pull_request events: PR head from the (possibly fork) head repo.
        # On workflow_dispatch: the branch the dispatch was on.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: llvm-project
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout SPIRV-LLVM-Translator (amd-staging)
        # Pinned to amd-staging because llvm-project PRs don't change
        # the translator. Without an explicit repository/ref, checkout
        # defaults to the workflow's own repo (llvm-project) and clobbers
        # the translator path with llvm-project content.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ROCm/SPIRV-LLVM-Translator
          ref: ${{ needs.build.outputs.translator_sha }}
          path: ${{ env.TRANSLATOR_SRC }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download build tree artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: linux-build-tree

      - name: Untar build trees
        run: |
          tar -xmf linux-build-tree.tar

      - name: Test - LLVM SPIRV backend (check-llvm-codegen-spirv)
        run: python build/bin/llvm-lit -sv --no-progress-bar llvm-project/llvm/test/CodeGen/SPIRV

  # =====================================================================
  # Test - Comgr (lit + gtest + ctest)
  # =====================================================================
  test_comgr:
    name: Test Comgr
    needs: build
    runs-on: aws-linux-scale-rocm-large
    timeout-minutes: 30
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:34ac4cb83216f760d8132ec2fabed4062f8c1fe40c94c70f58e8d7f8a7931ada

    steps:
      - name: Checkout llvm-project (PR head)
        # On pull_request events: PR head from the (possibly fork) head repo.
        # On workflow_dispatch: the branch the dispatch was on.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: llvm-project
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout SPIRV-LLVM-Translator (amd-staging)
        # Pinned to amd-staging because llvm-project PRs don't change
        # the translator. Without an explicit repository/ref, checkout
        # defaults to the workflow's own repo (llvm-project) and clobbers
        # the translator path with llvm-project content.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ROCm/SPIRV-LLVM-Translator
          ref: ${{ needs.build.outputs.translator_sha }}
          path: ${{ env.TRANSLATOR_SRC }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download build tree artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: linux-build-tree

      # touch build.ninja so it's newer than CMakeCache.txt — without it
      # tar -m's per-file mtimes can trigger a cmake regen + cascade rebuild.
      - name: Untar build trees
        run: |
          tar -xmf linux-build-tree.tar
          touch "$LLVM_BUILD/build.ninja" "$COMGR_BUILD/build.ninja" "$DEVLIBS_BUILD/build.ninja"

      - name: Test - Comgr (check-comgr)
        # check-comgr depends on test-lit (runs lit suite) and test-unit
        # (runs gtest binaries via its COMMAND block), then runs ctest for
        # the legacy C tests. Single target = all three test layers.
        id: check_comgr
        run: ninja -C "$COMGR_BUILD" check-comgr

      - name: Show failed Comgr ctest output
        # check-comgr invokes ctest without --output-on-failure, so failures
        # show "***Failed" with no stderr. Re-run any failed cases verbosely
        # and redirect comgr's internal log buffer to stderr so clang errors
        # from inside amd_comgr_do_action() surface (otherwise comgr just
        # returns AMD_COMGR_STATUS_ERROR with no detail).
        if: failure() && steps.check_comgr.conclusion == 'failure'
        env:
          AMD_COMGR_REDIRECT_LOGS: stderr
        run: ctest --test-dir "$COMGR_BUILD" --output-on-failure --rerun-failed

  # =====================================================================
  # Test - rocm-examples
  # =====================================================================

  # Select the gfx942 test runner the same way TheRock CI does.
  # TheRock's local matrix still lists the disabled non-CSP pool, so overlay
  # runner labels from therock-ci-config instead of using that list directly.
  pick_runner:
    name: Select gfx942 test runner
    needs: [build]
    runs-on: aws-linux-scale-rocm-large
    timeout-minutes: 5
    outputs:
      test_runs_on: ${{ steps.pick.outputs.label }}
    steps:
      - name: Checkout TheRock build_tools
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ROCm/TheRock
          ref: main
          sparse-checkout: build_tools
          persist-credentials: false

      - name: Checkout CI config
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ROCm/therock-ci-config
          ref: main
          path: ci-config
          persist-credentials: false

      - name: Weighted runner selection (gfx94X-dcgpu)
        id: pick
        env:
          CI_CONFIG_PATH: ci-config
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import sys
          from contextlib import redirect_stdout

          sys.path.insert(0, "build_tools/github_actions")
          with redirect_stdout(sys.stderr):
              from amdgpu_family_matrix import (
                  get_all_families_for_trigger_types,
                  load_external_runner_config,
                  select_weighted_label,
              )
              if load_external_runner_config() is None:
                  raise SystemExit("therock-ci-config did not load")
              info = get_all_families_for_trigger_types(["presubmit"])["gfx94x"]["linux"]
              labels = info.get("test-runs-on-labels") or [
                  {"label": info["test-runs-on"]}
              ]
              label = select_weighted_label(labels, "gfx94X-dcgpu")
          print(f"label={label}")
          PY

  test_rocm_examples:
    name: Test rocm-examples
    needs: [build, pick_runner]
    runs-on: ${{ needs.pick_runner.outputs.test_runs_on }}
    # Match the translator's spirv-ci-linux.yml (#268): the gfx942 runner is
    # slow/contended and 45m was cutting the job before it could finish.
    timeout-minutes: 240
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:34ac4cb83216f760d8132ec2fabed4062f8c1fe40c94c70f58e8d7f8a7931ada
      options: |
        --device=/dev/kfd --device=/dev/dri  --group-add video


    steps:
      - name: Checkout rocm-examples
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          repository: ROCm/rocm-examples
          ref: amd-staging
          path: rocm-examples

      - name: Download GPU compiler and runtime
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: linux-gpu-runtime

      - name: Untar GPU compiler and runtime
        run: tar -xf linux-gpu-runtime.tar

      # HIP-Basic.
      - name: ROCm Examples build HIP-Basic
        run: |
          STAGING=$PWD/$STAGING
          LLVM_PATH=$PWD/$LLVM_BUILD
          cmake -S rocm-examples/HIP-Basic -B examples-build-hip-basic         \
            -DCMAKE_CXX_COMPILER=$LLVM_PATH/bin/clang++                        \
            -DCMAKE_HIP_COMPILER=$LLVM_PATH/bin/clang++                        \
            -DCMAKE_HIP_ARCHITECTURES=amdgcnspirv                              \
            -DCMAKE_HIP_COMPILER_ROCM_ROOT=$STAGING                            \
            -DCMAKE_PREFIX_PATH=$STAGING                                       \
            -DCMAKE_DISABLE_FIND_PACKAGE_Perl=TRUE                             \
            -DCMAKE_HIP_FLAGS="--rocm-path=$STAGING"                           \
            -DCMAKE_HIP_STANDARD_LIBRARIES=-lamdhip64                          \
            -DCMAKE_HIP_LINK_FLAGS="-L$STAGING/lib -Wl,-rpath,$STAGING/lib -Wl,--no-as-needed -lamdhip64 -Wl,--as-needed" \
            -DCMAKE_EXE_LINKER_FLAGS="-L$STAGING/lib -Wl,-rpath,$STAGING/lib -Wl,--no-as-needed -lamdhip64 -Wl,--as-needed"
          cmake --build examples-build-hip-basic -j $(nproc)

      - name: ROCm Examples run HIP-Basic
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/${{ env.STAGING }}/lib
        run: |
          ctest --test-dir examples-build-hip-basic --output-on-failure -j $(nproc)

      # Applications.
      - name: ROCm Examples build Applications
        run: |
          STAGING=$PWD/$STAGING
          LLVM_PATH=$PWD/$LLVM_BUILD
          cmake -S rocm-examples/Applications -B examples-build-Applications   \
            -DCMAKE_CXX_COMPILER=$LLVM_PATH/bin/clang++                        \
            -DCMAKE_HIP_COMPILER=$LLVM_PATH/bin/clang++                        \
            -DCMAKE_HIP_ARCHITECTURES=amdgcnspirv                              \
            -DCMAKE_HIP_COMPILER_ROCM_ROOT=$STAGING                            \
            -DCMAKE_PREFIX_PATH=$STAGING                                       \
            -DCMAKE_HIP_FLAGS="--rocm-path=$STAGING"                           \
            -DCMAKE_HIP_STANDARD_LIBRARIES=-lamdhip64                          \
            -DCMAKE_HIP_LINK_FLAGS="-L$STAGING/lib -Wl,-rpath,$STAGING/lib -Wl,--no-as-needed -lamdhip64 -Wl,--as-needed" \
            -DCMAKE_EXE_LINKER_FLAGS="-L$STAGING/lib -Wl,-rpath,$STAGING/lib -Wl,--no-as-needed -lamdhip64 -Wl,--as-needed"
          cmake --build examples-build-Applications -j $(nproc)

      - name: ROCm Examples run Applications
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/${{ env.STAGING }}/lib
        run: |
          ctest --test-dir examples-build-Applications --output-on-failure -j $(nproc)

      # Libraries.
      - name: ROCm Examples build Libraries
        run: |
          STAGING=$PWD/$STAGING
          LLVM_PATH=$PWD/$LLVM_BUILD
          cmake -S rocm-examples/Libraries -B examples-build-Libraries         \
            -DCMAKE_CXX_COMPILER=$LLVM_PATH/bin/clang++                        \
            -DCMAKE_HIP_COMPILER=$LLVM_PATH/bin/clang++                        \
            -DCMAKE_HIP_COMPILER_ROCM_ROOT=$STAGING                            \
            -DCMAKE_PREFIX_PATH=$STAGING                                       \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY                     \
            -DHIP_PLATFORM=amd                                                 \
            -DROCM_PATH=$STAGING                                               \
            -DCMAKE_HIP_ARCHITECTURES=amdgcnspirv                              \
            -DCMAKE_DISABLE_FIND_PACKAGE_Perl=TRUE                             \
            -DCMAKE_HIP_FLAGS="-DROCPRIM_DISABLE_DPP=1 --offload-new-driver --rocm-path=$STAGING -use-spirv-backend --rtlib=libgcc -unwindlib=libgcc" \
            -DCMAKE_HIP_STANDARD_LIBRARIES=-lamdhip64                          \
            -DCMAKE_HIP_LINK_FLAGS="--rtlib=libgcc -unwindlib=libgcc -L$STAGING/lib -Wl,-rpath,$STAGING/lib -Wl,--no-as-needed -lamdhip64 -Wl,--as-needed -Wl,--unresolved-symbols=ignore-in-shared-libs" \
            -DCMAKE_CXX_FLAGS="--rtlib=libgcc -unwindlib=libgcc"               \
            -DCMAKE_EXE_LINKER_FLAGS="--rtlib=libgcc -unwindlib=libgcc -L$STAGING/lib -Wl,-rpath,$STAGING/lib -Wl,--no-as-needed -lamdhip64 -Wl,--as-needed -Wl,--unresolved-symbols=ignore-in-shared-libs" \
            -DCMAKE_SHARED_LINKER_FLAGS="--rtlib=libgcc -unwindlib=libgcc -L$STAGING/lib -Wl,--no-as-needed -lamdhip64 -Wl,--as-needed"
          cmake --build examples-build-Libraries -j $(nproc)

      - name: ROCm Examples run Libraries
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/${{ env.STAGING }}/lib
        run: |
          ctest --test-dir examples-build-Libraries --output-on-failure -j $(nproc)

  # =====================================================================
  # Test - HeCBench (curated subset, amdgcnspirv-be backend)
  # =====================================================================
  # Builds + runs a curated HeCBench subset through the in-tree SPIRV backend and
  # gates on each benchmark's self-verification. Scripts, list and pin come from
  # the translator's .github (single source of truth; bumped there daily).
  test_hecbench:
    name: Test HeCBench
    needs: [build, pick_runner]
    runs-on: ${{ needs.pick_runner.outputs.test_runs_on }}
    timeout-minutes: 240
    # This image defaults inline `run:` steps to `sh`; force bash so the steps
    # below can use arrays, process substitution, and [[ ]].
    defaults:
      run:
        shell: bash
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:34ac4cb83216f760d8132ec2fabed4062f8c1fe40c94c70f58e8d7f8a7931ada
      options: |
        --device=/dev/kfd --device=/dev/dri  --group-add video

    env:
      SCRIPTS: ${{ github.workspace }}/SPIRV-LLVM-Translator/.github/hecbench
      HECBENCH_LOG_DIR: ${{ github.workspace }}/SPIRV-LLVM-Translator/.github/hecbench/bench_logs_${{ github.run_id }}-${{ github.run_attempt }}_amdgcnspirv-be

    steps:
      # Translator .github only, at the Build job's SHA; subdir avoids the
      # untarred build/ + staging/.
      - name: Checkout SPIRV-LLVM-Translator .github (Build job SHA)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ROCm/SPIRV-LLVM-Translator
          ref: ${{ needs.build.outputs.translator_sha }}
          path: SPIRV-LLVM-Translator
          sparse-checkout: .github
          fetch-depth: 1
          persist-credentials: false

      - name: Read HeCBench pin from translator
        run: |
          ref=$(grep -oP 'HECBENCH_REF:\s*\K\S+' \
            SPIRV-LLVM-Translator/.github/workflows/spirv-ci-linux.yml || true)
          # Full SHA only: immutable pin, no git option injection.
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::bad HECBENCH_REF: '$ref'"; exit 1; }
          echo "HECBENCH_REF=$ref" >> "$GITHUB_ENV"

      - name: Download GPU compiler and runtime
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: linux-gpu-runtime

      - name: Untar GPU compiler and runtime
        run: tar -xf linux-gpu-runtime.tar

      # Single sparse, shallow blob:none pass over the subset + precomputed deps
      # (ci_benchmarks.deps.txt from update_deps.sh): ~90 MB, not the full repo.
      - name: Checkout HeCBench (pinned, sparse subset)
        run: |
          git init -q HeCBench
          cd HeCBench
          git remote add origin https://github.com/ORNL/HeCBench.git
          git fetch -q --depth=1 --filter=blob:none origin "$HECBENCH_REF"
          git sparse-checkout init --no-cone
          mapfile -t paths < <(
            grep -hvE '^[[:space:]]*(#|$)' \
              "$SCRIPTS/ci_benchmarks.txt" "$SCRIPTS/ci_benchmarks.deps.txt" \
              | sed 's#^#/src/#; s#$#/#')
          git sparse-checkout set --no-cone "${paths[@]}"
          git checkout -q FETCH_HEAD
          echo "Checked out $(find src -maxdepth 1 -type d -name '*-hip' | wc -l) -hip dirs"

      # Rewrite Makefiles for the staged ROCm, then build+run+self-verify.
      # bench.sh always exits 0 (results land in its log dir); next step gates.
      - name: Run HeCBench subset
        env:
          ROCM_PATH: ${{ github.workspace }}/${{ env.STAGING }}
          HIP_CLANG_PATH: ${{ github.workspace }}/${{ env.LLVM_BUILD }}/bin
          HECBENCH_SRC: ${{ github.workspace }}/HeCBench/src
        run: |
          # Surface the toolchain layout: does staging provide a usable hipcc?
          echo "ROCM_PATH=$ROCM_PATH"; ls -la "$ROCM_PATH/bin" | grep -iE 'hip|clang' || true
          "$SCRIPTS/modify_makefiles.sh"
          FILTER=$(grep -vE '^[[:space:]]*(#|$)' "$SCRIPTS/ci_benchmarks.txt" | paste -sd,)
          "$SCRIPTS/bench.sh" --gpu-id 0 --timeout 300 --filter "$FILTER"

      - name: Gate on HeCBench results
        if: always()
        run: |
          if [[ ! -d "$HECBENCH_LOG_DIR" ]]; then
            echo "::error::No HeCBench log dir produced (run step failed early)."
            exit 1
          fi
          echo "Log dir: $HECBENCH_LOG_DIR"
          for cat in success suspect failed timeout skipped; do
            n=$( [[ -f "$HECBENCH_LOG_DIR/$cat.log" ]] && wc -l < "$HECBENCH_LOG_DIR/$cat.log" || echo 0 )
            echo "  $cat: $n"
          done
          rc=0
          for cat in failed timeout suspect; do
            if [[ -s "$HECBENCH_LOG_DIR/$cat.log" ]]; then
              echo "::group::$cat"; cat "$HECBENCH_LOG_DIR/$cat.log"; echo "::endgroup::"
              echo "::error::HeCBench $cat: $(wc -l < "$HECBENCH_LOG_DIR/$cat.log") benchmark(s)."
              rc=1
            fi
          done
          # bench.sh silently skips benchmarks it can't find or enter.
          notrun=$(grep -vE '^[[:space:]]*(#|$)' "$SCRIPTS/ci_benchmarks.txt" | sort -u \
            | comm -23 - <(cat "$HECBENCH_LOG_DIR"/{success,suspect,failed,timeout}.log | sort -u))
          if [[ -n "$notrun" ]]; then
            echo "::error::HeCBench not run: ${notrun//$'\n'/ }"
            rc=1
          fi
          if [[ ! -s "$HECBENCH_LOG_DIR/success.log" ]]; then
            echo "::error::No HeCBench benchmark succeeded — toolchain/setup problem."
            rc=1
          fi
          exit $rc

      - name: Record HeCBench binary sizes
        if: always()
        run: |
          python3 - <<'PYTHON'
          import csv
          import os
          from pathlib import Path

          src = Path("HeCBench/src")
          benchmarks = (Path(os.environ["SCRIPTS"]) / "ci_benchmarks.txt").read_text().splitlines()
          rows: list[tuple[str, int]] = []
          for benchmark in sorted(set(line.strip() for line in benchmarks)):
              if not benchmark or benchmark.startswith("#"):
                  continue
              directory = src / benchmark
              if Path(benchmark).name != benchmark or not directory.is_dir():
                  raise RuntimeError(f"Invalid or missing benchmark directory: {benchmark}")
              for path in sorted(directory.rglob("*")):
                  if path.is_symlink() or not path.is_file() or not os.access(path, os.X_OK):
                      continue
                  # Exclude executable scripts; measure the unstripped ELF binaries.
                  with path.open("rb") as binary:
                      if binary.read(4) != b"\x7fELF":
                          continue
                  rows.append((path.relative_to(src).as_posix(), path.stat().st_size))
          if not rows:
              raise RuntimeError("No HeCBench binaries found")

          report = Path(os.environ["HECBENCH_LOG_DIR"]) / "binary-sizes.csv"
          with report.open("w", newline="") as output:
              writer = csv.writer(output)
              writer.writerow(("path", "size_bytes"))
              writer.writerows(rows)
          total = sum(size for _, size in rows)
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write(f"### HeCBench binary sizes\n\n{len(rows)} files, {total} bytes.\n\n")
              summary.write("Per-file sizes: `binary-sizes.csv` in the `hecbench-logs` artifact.\n\n")
              summary.write("Compare matching file lists; failed builds may leave partial results.\n")
          print(f"Recorded {len(rows)} binary sizes ({total} bytes) in {report}")
          PYTHON

      - name: Upload HeCBench logs and binary sizes
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hecbench-logs
          path: ${{ env.HECBENCH_LOG_DIR }}/
          if-no-files-found: ignore
