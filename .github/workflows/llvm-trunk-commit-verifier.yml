# Web entry point. This file stays on amd-staging so Run workflow is shown.
# The selected branch can stay on amd-staging: the job always calls the
# verifier implementation on amd-compiler-ci.

name: LLVM trunk commit verifier

on:
  workflow_dispatch:
    inputs:
      LLVM_UPSTREAM_REF:
        description: "Upstream llvm/llvm-project PR URL, commit SHA, branch, or fork shorthand owner:branch. Comma-separated values are merged in order. ex: https://github.com/llvm/llvm-project/pull/1 or fmeum:coverage-skipped-comment-fixes"
        required: false
        type: string
        default: ""
      LLVM_ROCm_PR_URL:
        description: "LLVM ROCm PR url. ex: https://github.com/ROCm/llvm-project/pull/1"
        required: false
        type: string
        default: ""
      SPIRV_PR_URL:
        description: "SPIRV PR url. ex: https://github.com/ROCm/SPIRV-LLVM-Translator/pull/1"
        required: false
        type: string
        default: ""
      HIPIFY_PR_URL:
        description: "HIPIFY PR url. ex: https://github.com/ROCm/HIPIFY/pull/1 "
        required: false
        type: string
        default: ""
      linux_amdgpu_families:
        type: string
        description: "Comma-separated Linux GPU families. Leave both family inputs empty to run the default Linux and Windows sets. Setting only this input skips Windows. Setting only the Windows input skips Linux."
        default: ""
      linux_test_labels:
        type: string
        description: "Comma-separated test options. Use test:* to filter tests (e.g. test:rocprim). Use test_filter:* to set test type (e.g. test_filter:quick)."
        default: ""
      windows_amdgpu_families:
        type: string
        description: "Comma-separated Windows GPU families. Leave both family inputs empty to run the default Linux and Windows sets. Setting only this input skips Linux. Setting only the Linux input skips Windows."
        default: ""
      windows_test_labels:
        type: string
        description: "Comma-separated test options. Use test:* to filter tests (e.g. test:rocprim). Use test_filter:* to set test type (e.g. test_filter:quick)."
        default: ""
      prebuilt_stages:
        type: string
        default: ""
        description: "Comma-separated build stages to skip (or 'all' for all stages); artifacts are copied from baseline_run_id instead"
      baseline_run_id:
        type: string
        default: ""
        description: "Workflow run ID to copy prebuilt stage artifacts from; required when prebuilt_stages is set"
      changed_projects:
        type: string
        default: ""
        description: "Comma-separated list of changed projects to filter tests (empty = run all tests)"
      build_pytorch:
        type: boolean
        default: true
        description: "Build PyTorch wheels"

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    uses: ROCm/llvm-project/.github/workflows/llvm-trunk-commit-verifier.yml@amd-compiler-ci
    with:
      LLVM_UPSTREAM_REF: ${{ inputs.LLVM_UPSTREAM_REF }}
      LLVM_ROCm_PR_URL: ${{ inputs.LLVM_ROCm_PR_URL }}
      SPIRV_PR_URL: ${{ inputs.SPIRV_PR_URL }}
      HIPIFY_PR_URL: ${{ inputs.HIPIFY_PR_URL }}
      linux_amdgpu_families: ${{ inputs.linux_amdgpu_families }}
      linux_test_labels: ${{ inputs.linux_test_labels }}
      windows_amdgpu_families: ${{ inputs.windows_amdgpu_families }}
      windows_test_labels: ${{ inputs.windows_test_labels }}
      prebuilt_stages: ${{ inputs.prebuilt_stages }}
      baseline_run_id: ${{ inputs.baseline_run_id }}
      changed_projects: ${{ inputs.changed_projects }}
      build_pytorch: ${{ inputs.build_pytorch }}
    secrets: inherit
