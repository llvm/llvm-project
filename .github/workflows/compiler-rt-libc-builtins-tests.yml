# Pre-commit CI for the compiler-rt + LLVM-libc builtins integration.
name: compiler-rt + libc Builtins Tests
permissions:
  contents: read
on:
  pull_request:
    paths:
      - "compiler-rt/lib/builtins/**"
      - "compiler-rt/test/builtins/**"
      - "libc/shared/builtins.h"
      - "libc/shared/builtins/**"
      - "libc/src/__support/builtins/**"
      - "libc/src/__support/FPUtil/**"
      - ".github/workflows/compiler-rt-libc-builtins-tests.yml"

jobs:
  build:
    name: builtins (${{ matrix.os }})
    if: github.repository_owner == 'llvm'
    runs-on: ${{ matrix.os }}
    container:
      image: ${{ (startsWith(matrix.os, 'ubuntu-26.04-arm') &&
        'ghcr.io/llvm/arm64v8/libc-ubuntu-26.04:latest@sha256:d17a6266bd50c96c7c6bd03abf55cb70ae7b5aaa8743e656904d71f9470ed0be') ||
        'ghcr.io/llvm/libc-ubuntu-26.04:latest@sha256:28aa84faf663cb4f4b9b01a0fd64e39a7701b6cf7844b8f24fcecdca680752f7' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure CMake
        run: |
          cmake \
            -B build \
            -S runtimes \
            -DLLVM_ENABLE_RUNTIMES=compiler-rt \
            -G Ninja \
            -DCMAKE_C_COMPILER=clang-23 \
            -DCMAKE_CXX_COMPILER=clang++-23 \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DCOMPILER_RT_STANDALONE_BUILD=ON \
            -DCOMPILER_RT_USE_LIBC_MATH=ON \
            -DLLVM_EXTERNAL_LIT=$(which lit-23) \
            -DCOMPILER_RT_INCLUDE_TESTS=ON

      - name: Test compiler-rt builtins
        run: |
          cmake \
            --build build \
            --parallel \
            --target check-builtins
