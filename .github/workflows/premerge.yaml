name: CI Checks

permissions:
  contents: read

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      # When a PR is closed, we still start this workflow, but then skip
      # all the jobs, which makes it effectively a no-op.  The reason to
      # do this is that it allows us to take advantage of concurrency groups
      # to cancel in progress CI jobs whenever the PR is closed.
      - closed
  push:
    branches:
      - 'release/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # Computes which projects/check-targets to build and test on the
  # self-hosted macOS runners.
  premerge-compute:
    name: Compute Projects
    if: >-
        github.repository_owner == 'llvm' &&
        (github.event_name != 'pull_request' || github.event.action != 'closed')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      macos-projects: ${{ steps.vars.outputs.macos-projects }}
      macos-check-targets: ${{ steps.vars.outputs.macos-check-targets }}
      macos-runtimes: ${{ steps.vars.outputs.macos-runtimes }}
      macos-runtimes-check-targets: ${{ steps.vars.outputs.macos-runtimes-check-targets }}
      Linux-values: ${{ steps.vars.outputs.Linux-values }}
      Windows-values: ${{ steps.vars.outputs.Windows-values }}
      Darwin-values: ${{ steps.vars.outputs.Darwin-values }}

    steps:
      - name: Checkout LLVM (sparse)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          sparse-checkout: .ci
          sparse-checkout-cone-mode: false
      - name: Get Changed Files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename' > /tmp/changed_files.txt
          else
            gh api "repos/${REPO}/compare/${{ github.event.before }}...${{ github.event.after }}" --paginate --jq '.files[].filename' > /tmp/changed_files.txt
          fi
          cat /tmp/changed_files.txt
      - name: Compute Projects
        id: vars
        run: |
          for p in Linux Windows Darwin; do
            echo $p-values=$(python3 .ci/compute_projects.py $p < /tmp/changed_files.txt) >> $GITHUB_OUTPUT
          done

  premerge-checks-linux:
    name: Build and Test Linux
    needs: premerge-compute
    if: >-
        github.repository_owner == 'llvm' &&
        (github.event_name != 'pull_request' || github.event.action != 'closed') &&
        fromJSON(needs.premerge-compute.outputs.Linux-values).projects_to_build != ''
    runs-on: llvm-premerge-linux-runners
    env: ${{ fromJSON(needs.premerge-compute.outputs.Linux-values) }}
    defaults:
      run:
        # The run step defaults to using sh as the shell when running in a
        # container, so make bash the default to ensure consistency between
        # container and non-container jobs.
        shell: bash
    steps:
      - name: Checkout LLVM
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Build and Test
        timeout-minutes: 120
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "Building projects: ${projects_to_build}"
          echo "Running project checks targets: ${project_check_targets}"
          echo "Building runtimes: ${runtimes_to_build}"
          echo "Running runtimes checks targets: ${runtimes_check_targets}"
          echo "Running runtimes checks requiring reconfiguring targets: ${runtimes_check_targets_needs_reconfig}"

          export CC=/opt/llvm/bin/clang
          export CXX=/opt/llvm/bin/clang++

          # This environment variable is passes into the container through the
          # runner pod definition. This differs between our two clusters which
          # why we do not hardcode it.
          export SCCACHE_GCS_BUCKET=$CACHE_GCS_BUCKET
          export SCCACHE_GCS_RW_MODE=READ_WRITE

          # Set the idle timeout to zero to ensure sccache runs for the
          # entire duration of the job. Otherwise it might stop if we run
          # several test suites in a row and discard statistics that we want
          # to save in the end.
          export SCCACHE_IDLE_TIMEOUT=0
          mkdir artifacts
          SCCACHE_LOG=info SCCACHE_ERROR_LOG=$(pwd)/artifacts/sccache.log sccache --start-server

          ./.ci/monolithic-linux.sh "${projects_to_build}" "${project_check_targets}" "${runtimes_to_build}" "${runtimes_check_targets}" "${runtimes_check_targets_needs_reconfig}" "${enable_cir}"
      - name: Upload Artifacts
        # In some cases, Github will fail to upload the artifact. We want to
        # continue anyways as a failed artifact upload is an infra failure, not
        # a checks failure.
        # https://github.com/actions/upload-artifact/issues/569
        continue-on-error: true
        if: '!cancelled()'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Premerge Artifacts (Linux ${{ runner.arch }})
          path: artifacts/
          retention-days: 5
          include-hidden-files: 'true'
      - name: Upload Comment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        continue-on-error: true
        with:
          name: workflow-args-x86-linux
          path: |
            comments-Linux-x86_64

  premerge-checks-windows:
    name: Build and Test Windows
    needs: premerge-compute
    if: >-
        github.repository_owner == 'llvm' &&
        (github.event_name != 'pull_request' || github.event.action != 'closed') &&
        fromJSON(needs.premerge-compute.outputs.Windows-values).projects_to_build != ''
    runs-on: llvm-premerge-windows-2022-runners
    env: ${{ fromJSON(needs.premerge-compute.outputs.Windows-values) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout LLVM
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Build and Test
        timeout-minutes: 180
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          WINDOWS_PROJECTS: ${{ env.projects_to_build }}
          WINDOWS_CHECK_TARGETS: ${{ env.check_targets }}
          WINDOWS_RUNTIMES: ${{ env.runtimes_to_build }}
          WINDOWS_RUNTIMES_CHECK_TARGETS: ${{ env.runtimes_check_targets }}
        run: |
          bash -c "echo Building projects: ${projects_to_build}"
          bash -c "echo Running project checks targets: ${project_check_targets}"
          bash -c "echo Building runtimes: ${runtimes_to_build}"
          bash -c "echo Running runtimes checks targets: ${runtimes_check_targets}"
          call C:\\BuildTools\\Common7\\Tools\\VsDevCmd.bat -arch=amd64 -host_arch=amd64
          # See the comments above in the Linux job for why we define each of
          # these environment variables.
          bash -c "export SCCACHE_GCS_BUCKET=$CACHE_GCS_BUCKET; export SCCACHE_GCS_RW_MODE=READ_WRITE; export SCCACHE_IDLE_TIMEOUT=0; mkdir artifacts; SCCACHE_LOG=info SCCACHE_ERROR_LOG=$(pwd)/artifacts/sccache.log sccache --start-server; .ci/monolithic-windows.sh \"$WINDOWS_PROJECTS\" \"$WINDOWS_CHECK_TARGETS\" \"$WINDOWS_RUNTIMES\" \"$WINDOWS_RUNTIMES_CHECK_TARGETS\""
      - name: Upload Artifacts
        # In some cases, Github will fail to upload the artifact. We want to
        # continue anyways as a failed artifact upload is an infra failure, not
        # a checks failure.
        # https://github.com/actions/upload-artifact/issues/569
        continue-on-error: true
        if: '!cancelled()'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Premerge Artifacts (Windows)
          path: artifacts/
          retention-days: 5
          include-hidden-files: 'true'
      - name: Upload Comment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        continue-on-error: true
        with:
          name: workflow-args-windows
          path: |
            comments-Windows-AMD64


  premerge-check-macos:
    name: Build and Test macOS arm64
    needs: premerge-compute
    runs-on: [self-hosted, macOS, ARM64, apple-runners]
    # Skip the self-hosted runner entirely if there is nothing to build,
    # rather than tying up a runner slot for a no-op run.
    if: >-
        github.repository_owner == 'llvm' &&
        (github.event_name != 'pull_request' || github.event.action != 'closed') &&
        fromJSON(needs.premerge-compute.outputs.Darwin-values).projects_to_build != ''
    env: ${{ fromJSON(needs.premerge-compute.outputs.Darwin-values) }}
    steps:
      - name: Checkout LLVM
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Install Ninja, CMake, and sccache
        run: |
          brew install ninja cmake
          command -v sccache >/dev/null || brew install sccache
      - name: Set up Python venv
        run: |
          "$(brew --prefix python@3.14)/bin/python3.14" -m venv "${RUNNER_TEMP}/venv"
          echo "${RUNNER_TEMP}/venv/bin" >> "$GITHUB_PATH"
      - name: Build and Test
        timeout-minutes: 240
        env:
          SCCACHE_BUCKET: sccache-bucket
          SCCACHE_REGION: us-west-2
          PROJECTS: ${{ env.projects_to_build }}
          CHECK_TARGETS: ${{ env.project_check_targets }}
          RUNTIMES: ${{ env.runtimes_to_build }}
          RUNTIMES_CHECK_TARGETS: ${{ env.runtimes_check_targets }}
          CLANG_TOOLCHAIN_PROGRAM_TIMEOUT: 120
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "Building projects: ${projects_to_build}"
          echo "Running project checks targets: ${project_check_targets}"
          echo "Building runtimes: ${runtimes_to_build}"
          echo "Running runtimes checks targets: ${runtimes_check_targets}"

          export SCCACHE_IDLE_TIMEOUT=0
          mkdir -p artifacts
          SCCACHE_LOG=info SCCACHE_ERROR_LOG=$(pwd)/artifacts/sccache.log sccache --start-server

          ./.ci/monolithic-macos.sh "${PROJECTS}" "${CHECK_TARGETS}" "${RUNTIMES}" "${RUNTIMES_CHECK_TARGETS}"
      - name: Upload Artifacts
        # In some cases, Github will fail to upload the artifact. We want to
        # continue anyways as a failed artifact upload is an infra failure, not
        # a checks failure.
        # https://github.com/actions/upload-artifact/issues/569
        continue-on-error: true
        if: '!cancelled()'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Premerge Artifacts (macOS arm64)
          path: artifacts/
          retention-days: 5
          include-hidden-files: 'true'
