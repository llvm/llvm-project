# This file defines pre-commit CI for libc++, libc++abi, and libunwind (on Github).
#
# We split the configurations in multiple stages with the intent of saving compute time
# when a job fails early in the pipeline. This is why the jobs are marked as `continue-on-error: false`.
# We try to run the CI configurations with the most signal in the first stage.
#
# Stages 1 & 2 are meant to be "smoke tests", and are meant to catch most build/test failures quickly and without using
# too many resources.
# Stage 3 is "everything else", and is meant to catch breakages on more niche or unique configurations.
#
# Therefore, we "fail-fast" for any failures during stages 1 & 2, meaning any job failing cancels all other running jobs,
# under the assumption that if the "smoke tests" fail, then the other configurations will likely fail in the same way.
# However, stage 3 does not fail fast, as it's more likely that any one job failing is a flake or a configuration-specific
#
name: Build and Test libc++
on:
  pull_request:
    paths:
      - 'libcxx/**'
      - 'libcxxabi/**'
      - 'libunwind/**'
      - 'runtimes/**'
      - 'cmake/**'
      - '.github/workflows/libcxx-build-and-test.yaml'
  schedule:
    # Run nightly at 08:00 UTC (aka 00:00 Pacific, aka 03:00 Eastern)
    - cron: '0 8 * * *'

permissions:
  contents: read # Default everything to read-only

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
        - config: generic-cxx23
          xcode-version: 26.5
    runs-on: ["self-hosted", "macOS", "apple-runners"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Diagnose the runner's tool cache
        run: |
          echo "whoami=$(whoami)  HOME=$HOME"
          echo "RUNNER_TOOL_CACHE=$RUNNER_TOOL_CACHE"
          echo "AGENT_TOOLSDIRECTORY=$AGENT_TOOLSDIRECTORY"
          echo "system python3: $(command -v python3) -> $(python3 --version 2>&1)"

      - name: Create the hostedtoolcache directory (setup-python macOS requirement)
        run: |
          mkdir -p /Users/runner/hostedtoolcache
          ls -ld /Users/runner/hostedtoolcache

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Verify the setup-python interpreter actually works
        run: |
          echo "which python3: $(command -v python3)"
          python3 --version
          python3 -c 'import sys, ssl, sqlite3; print("exe:", sys.executable)'   # dyld/ssl smoke test
          python3 -m venv /tmp/probe-venv
          /tmp/probe-venv/bin/pip install --upgrade pip
          /tmp/probe-venv/bin/pip install llvm-lnt                               # the exact benchmark failure

      - name: Select Xcode
        run: echo "DEVELOPER_DIR=/Applications/Xcode_${{ matrix.xcode-version }}.app/Contents/Developer" >> $GITHUB_ENV

      - name: Install Ninja and CMake
        run: |
          brew install ninja cmake

      - name: Build and test
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -r libcxx/test/requirements.txt
          xcrun bash libcxx/utils/ci/run-buildbot ${{ matrix.config }}
        env:
          CC: clang
          CXX: clang++
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()  # Upload artifacts even if the build or test suite fails
        with:
          name: macos-${{ matrix.config }}-results
          path: |
            **/test-results.xml
            **/*.abilist
            **/CMakeConfigureLog.yaml
            **/CMakeError.log
            **/CMakeOutput.log
            **/crash_diagnostics/*
