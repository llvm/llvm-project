# This file defines pre-commit CI for libc++, libc++abi, and libunwind (on Github).
#
# We split the configurations in multiple stages with the intent of saving compute time
# when a job fails early in the pipeline. This is why the jobs are marked as `continue-on-error: false`.
# We try to run the CI configurations with the most signal in the first stage.
#
# Stages 1 & 2 are meant to be "smoke tests", and are meant to catch most build/test failures quickly and without using
# too many resources.
# Stage 3 is "everything else", and is meant to catch breakages on more niche or unique configurations.
#
# Therefore, we "fail-fast" for any failures during stages 1 & 2, meaning any job failing cancels all other running jobs,
# under the assumption that if the "smoke tests" fail, then the other configurations will likely fail in the same way.
# However, stage 3 does not fail fast, as it's more likely that any one job failing is a flake or a configuration-specific
#
name: Build and Test libc++
on:
  pull_request:
    paths:
      - 'libcxx/**'
      - 'libcxxabi/**'
      - 'libunwind/**'
      - 'runtimes/**'
      - 'cmake/**'
      - '.github/workflows/libcxx-build-and-test.yaml'
  schedule:
    # Run nightly at 08:00 UTC (aka 00:00 Pacific, aka 03:00 Eastern)
    - cron: '0 8 * * *'

permissions:
  contents: read # Default everything to read-only

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
        - config: generic-cxx23
          xcode-version: 26.5
    runs-on: ["self-hosted", "macOS", "apple-runners"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Diagnose the runner's tool cache
        run: |
          echo "whoami=$(whoami)  HOME=$HOME"
          echo "RUNNER_TOOL_CACHE=$RUNNER_TOOL_CACHE"
          echo "AGENT_TOOLSDIRECTORY=$AGENT_TOOLSDIRECTORY"
          echo "system python3: $(command -v python3) -> $(python3 --version 2>&1)"

      - name: Install a modern Python via Homebrew
        run: |
          # Diagnostics in case 'brew update' cannot write to the Homebrew prefix.
          ls -ld /opt/homebrew /opt/homebrew/Library || true
          id

          # 'brew update' brings the Homebrew library in line with the formula API so that
          # python@3.12's post-install step can read the formula. Without it, post-install
          # fails with: FormulaUnreadableError: undefined method 'type' for an instance of
          # Resource::Patch (the installed Homebrew is older than the formula it installs).
          brew update
          brew install python@3.12
          echo "$(brew --prefix python@3.12)/libexec/bin" >> "$GITHUB_PATH"

      - name: Verify the Homebrew interpreter actually works
        run: |
          echo "which python3: $(command -v python3)"
          python3 --version
          python3 -c 'import sys, ssl, sqlite3; print("exe:", sys.executable)'   # dyld/ssl smoke test

      - name: Install llvm-lnt in a virtualenv
        run: |
          python3 -m venv /tmp/lnt-venv
          /tmp/lnt-venv/bin/pip install --upgrade pip
          /tmp/lnt-venv/bin/pip install llvm-lnt      # the exact package that failed in the benchmark job
          /tmp/lnt-venv/bin/lnt --version             # confirm the installed tool actually runs

