name: "Check LLVM ABI annotations"

on:
  pull_request:
    paths:
      - 'llvm/**'
      - '.github/workflows/ids-check.yml'
      - '!llvm/docs/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Check LLVM_ABI annotations with ids
    runs-on: ${{ matrix.runs-on }}
    container:
      image: ${{ matrix.image }} 
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-26.04
            image: 'ghcr.io/llvm/ci-ubuntu-26.04-ids-checks:latest@sha256:610825c41aea545132a5b441ee864acf050ac54ff40009fbaaf3e158f139e5d7'
          - runs-on: windows-2022
            image: null

    steps:
      - name: Setup crlf
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: ${{ github.workspace }}/llvm-project
          fetch-depth: 2

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          path: "./llvm-project"
          separator: ","
          skip_initial_fetch: true
          base_sha: 'HEAD~1'
          sha: 'HEAD'

      - if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=amd64 -host_arch=amd64
          set >> "%GITHUB_ENV%"

      - name: Configure and build minimal LLVM for use by ids
        shell: bash
        env:
          CC: ${{ case(runner.os == 'Windows', 'cl', 'clang') }}
          CXX: ${{ case(runner.os == 'Windows', 'cl', 'clang++') }}
        run: |
          cmake -B ./llvm-project/build/ \
                -S ./llvm-project/llvm/ \
                -D CMAKE_BUILD_TYPE=Release \
                -D LLVM_TARGETS_TO_BUILD="host" \
                -D LLVM_INCLUDE_BENCHMARKS=OFF \
                -D CMAKE_EXPORT_COMPILE_COMMANDS=ON \
                -D CMAKE_DISABLE_PRECOMPILE_HEADERS=ON \
                -D LLVM_BUILD_LLVM_DYLIB_VIS=ON \
                -D LLVM_LINK_LLVM_DYLIB=ON \
                -G Ninja
          if [ "$RUNNER_OS" = "Windows" ]; then
            exit 0
          fi
          # Build the generated-header prerequisites that idt needs to parse
          # LLVM source.
          BUILD_DIR=./llvm-project/build
          ninja -C "$BUILD_DIR" \
            llvm_vcsrevision_h \
            intrinsics_gen omp_gen acc_gen analysis_gen target_parser_gen vt_gen \
            DllOptionsTableGen LibOptionsTableGen \
            lib/ExecutionEngine/JITLink/COFFOptions.inc

          # Build per-target tablegen output for every enabled target.
          # Each enabled target exposes a top-level `<Target>CommonTableGen`
          # phony rule (e.g. `X86CommonTableGen`); discover them from the
          # ninja graph.
          TABLEGEN_TARGETS=$(ninja -C "$BUILD_DIR" -t targets all \
            | awk -F: '
                $2 ~ /phony/ &&            # phony rules only
                $1 !~ /\// &&              # top-level (skip nested paths)
                $1 ~ /CommonTableGen$/ {   # per-target tablegen aggregator
                  print $1
                }')
          ninja -C "$BUILD_DIR" $TABLEGEN_TARGETS

      - name: Run ids check
        if: runner.os != 'Windows'
        env:
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          echo "[]" > comments &&
          python ./llvm-project/llvm/utils/git/ids-check-helper.py \
            --token ${{ secrets.GITHUB_TOKEN }} \
            --issue-number $GITHUB_PR_NUMBER \
            --idt-path $(which idt) \
            --compile-commands ./llvm-project/build/compile_commands.json \
            --start-rev HEAD~1 \
            --end-rev HEAD \
            --changed-files "$CHANGED_FILES" \
            --verbose

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && runner.os != 'Windows'
        with:
          name: workflow-args
          path: |
            comments

      - name: Build and test libLLVM.so
        shell: bash
        run: |
          ninja -C ./llvm-project/build check-llvm
