name: "Test documentation build"

permissions:
  contents: read

on:
  push:
    branches:
      - 'main'
    paths:
      - 'bolt/docs/**'
      - 'llvm/docs/**'
      - 'clang/docs/**'
      - 'clang/include/clang/Basic/AttrDocs.td'
      - 'clang/include/clang/Driver/ClangOptionDocs.td'
      - 'clang/include/clang/Basic/DiagnosticDocs.td'
      - 'clang-tools-extra/docs/**'
      - 'lldb/docs/**'
      - 'libunwind/docs/**'
      - 'libcxx/docs/**'
      - 'libc/docs/**'
      - 'lld/docs/**'
      - 'openmp/docs/**'
      - 'polly/docs/**'
      - 'flang/docs/**'
      - 'flang/include/flang/Optimizer/Dialect/FIROps.td'
      - '.github/workflows/docs.yml'
      - 'llvm/cmake/modules/AddSphinxTarget.cmake'
  pull_request:
    paths:
      - 'bolt/docs/**'
      - 'llvm/docs/**'
      - 'clang/docs/**'
      - 'clang/include/clang/Basic/AttrDocs.td'
      - 'clang/include/clang/Driver/ClangOptionDocs.td'
      - 'clang/include/clang/Basic/DiagnosticDocs.td'
      - 'clang-tools-extra/docs/**'
      - 'lldb/docs/**'
      - 'libunwind/docs/**'
      - 'libcxx/docs/**'
      - 'libc/docs/**'
      - 'lld/docs/**'
      - 'openmp/docs/**'
      - 'polly/docs/**'
      - 'flang/docs/**'
      - 'flang/include/flang/Optimizer/Dialect/FIROps.td'
      - '.github/workflows/docs.yml'
      - 'llvm/cmake/modules/AddSphinxTarget.cmake'
      - 'utils/docs/**'

jobs:
  check-docs-build:
    name: "Test documentation build"
    runs-on: ubuntu-26.04
    if: github.repository == 'llvm/llvm-project'
    steps:
      - name: Fetch LLVM sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Get subprojects that have doc changes
        id: docs-changed-subprojects
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          skip_initial_fetch: true
          base_sha: 'HEAD~1'
          sha: 'HEAD'
          files_yaml: |
            llvm:
              - 'llvm/docs/**'
            bolt:
              - 'bolt/docs/**'
            clang:
              - 'clang/docs/**'
              - 'clang/include/clang/Basic/AttrDocs.td'
              - 'clang/include/clang/Driver/ClangOptionDocs.td'
              - 'clang/include/clang/Basic/DiagnosticDocs.td'
            clang-tools-extra:
              - 'clang-tools-extra/docs/**'
            lldb:
              - 'lldb/docs/**'
            libunwind:
              - 'libunwind/docs/**'
            libcxx:
              - 'libcxx/docs/**'
            libc:
              - 'libc/docs/**'
            lld:
              - 'lld/docs/**'
            openmp:
              - 'openmp/docs/**'
            polly:
              - 'polly/docs/**'
            flang:
              - 'flang/docs/**'
              - 'flang/include/flang/Optimizer/Dialect/FIROps.td'
            common:
              - '.github/workflows/docs.yml'
              - 'llvm/cmake/modules/AddSphinxTarget.cmake'
              - 'utils/docs/**'
      - name: Setup Python env
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
          cache: 'pip'
          cache-dependency-path: 'llvm/docs/requirements.txt'
      - name: Install python dependencies
        run: pip install --require-hashes -r llvm/docs/requirements.txt
      - name: Install system dependencies
        run: |
          sudo apt-get update
          # swig and graphviz are lldb specific dependencies
          sudo apt-get install -y cmake ninja-build swig graphviz
      - name: Setup output folder
        run: mkdir built-docs
      # The projects below link to each other's docs, so their docs are built
      # from a single configuration that has all of them enabled (CMake checks
      # this). The runtimes are configured separately and are not linked this
      # way.
      - name: Configure project docs
        if: |
          steps.docs-changed-subprojects.outputs.llvm_any_changed == 'true' ||
          steps.docs-changed-subprojects.outputs.bolt_any_changed == 'true' ||
          steps.docs-changed-subprojects.outputs.clang_any_changed == 'true' ||
          steps.docs-changed-subprojects.outputs.clang-tools-extra_any_changed == 'true' ||
          steps.docs-changed-subprojects.outputs.lldb_any_changed == 'true' ||
          steps.docs-changed-subprojects.outputs.lld_any_changed == 'true' ||
          steps.docs-changed-subprojects.outputs.polly_any_changed == 'true' ||
          steps.docs-changed-subprojects.outputs.flang_any_changed == 'true' ||
          steps.docs-changed-subprojects.outputs.common_any_changed == 'true'
        run: |
          cmake -B projects-build -GNinja -DCMAKE_BUILD_TYPE=Release -DLLVM_ENABLE_PROJECTS="bolt;clang;clang-tools-extra;lld;lldb;polly;mlir;flang" -DLLVM_ENABLE_SPHINX=ON ./llvm
      - name: Build LLVM docs
        if: |
          steps.docs-changed-subprojects.outputs.llvm_any_changed == 'true' ||
          steps.docs-changed-subprojects.outputs.common_any_changed == 'true'
        run: |
          TZ=UTC ninja -C projects-build docs-llvm-html docs-llvm-man
          mkdir built-docs/llvm
          cp -r projects-build/docs/* built-docs/llvm/
      - name: Build BOLT docs
        if: |
          steps.docs-changed-subprojects.outputs.bolt_any_changed == 'true' ||
          steps.docs-changed-subprojects.outputs.common_any_changed == 'true'
        run: |
          TZ=UTC ninja -C projects-build docs-bolt-html
          mkdir built-docs/bolt
          cp -r projects-build/tools/bolt/docs/* built-docs/bolt/
      - name: Build Clang docs
        if: |
          steps.docs-changed-subprojects.outputs.clang_any_changed == 'true' ||
          steps.docs-changed-subprojects.outputs.common_any_changed == 'true'
        run: |
          TZ=UTC ninja -C projects-build docs-clang-html docs-clang-man
          mkdir built-docs/clang
          cp -r projects-build/tools/clang/docs/* built-docs/clang/
      - name: Build clang-tools-extra docs
        if: |
          steps.docs-changed-subprojects.outputs.clang-tools-extra_any_changed == 'true' ||
          steps.docs-changed-subprojects.outputs.common_any_changed == 'true'
        run: |
          TZ=UTC ninja -C projects-build docs-clang-tools-html docs-clang-tools-man
          mkdir built-docs/clang-tools-extra
          cp -r projects-build/tools/clang/tools/extra/docs/* built-docs/clang-tools-extra/
      - name: Build LLDB docs
        if: |
          steps.docs-changed-subprojects.outputs.lldb_any_changed == 'true' ||
          steps.docs-changed-subprojects.outputs.common_any_changed == 'true'
        run: |
          TZ=UTC ninja -C projects-build docs-lldb-html docs-lldb-man
          mkdir built-docs/lldb
          cp -r projects-build/tools/lldb/docs/* built-docs/lldb/
      - name: Build LLD docs
        if: |
          steps.docs-changed-subprojects.outputs.lld_any_changed == 'true' ||
          steps.docs-changed-subprojects.outputs.common_any_changed == 'true'
        run: |
          TZ=UTC ninja -C projects-build docs-lld-html
          mkdir built-docs/lld
          cp -r projects-build/tools/lld/docs/* built-docs/lld/
      - name: Build Polly docs
        if: |
          steps.docs-changed-subprojects.outputs.polly_any_changed == 'true' ||
          steps.docs-changed-subprojects.outputs.common_any_changed == 'true'
        run: |
          TZ=UTC ninja -C projects-build docs-polly-html docs-polly-man
          mkdir built-docs/polly
          cp -r projects-build/tools/polly/docs/* built-docs/polly/
      - name: Build Flang docs
        if: |
          steps.docs-changed-subprojects.outputs.flang_any_changed == 'true' ||
          steps.docs-changed-subprojects.outputs.common_any_changed == 'true'
        run: |
          TZ=UTC ninja -C projects-build docs-flang-html docs-flang-man
          mkdir built-docs/flang
          cp -r projects-build/tools/flang/docs/* built-docs/flang/
      - name: Build libunwind docs
        if: |
          steps.docs-changed-subprojects.outputs.libunwind_any_changed == 'true' ||
          steps.docs-changed-subprojects.outputs.common_any_changed == 'true'
        run: |
          cmake -B libunwind-build -GNinja -DCMAKE_BUILD_TYPE=Release -DLLVM_ENABLE_RUNTIMES="libunwind" -DLLVM_ENABLE_SPHINX=ON ./runtimes
          TZ=UTC ninja -C libunwind-build docs-libunwind-html
          mkdir built-docs/libunwind
          cp -r libunwind-build/libunwind/docs/* built-docs/libunwind
      - name: Build libcxx docs
        if: |
          steps.docs-changed-subprojects.outputs.libcxx_any_changed == 'true' ||
          steps.docs-changed-subprojects.outputs.common_any_changed == 'true'
        run: |
          cmake -B libcxx-build -GNinja -DCMAKE_BUILD_TYPE=Release -DLLVM_ENABLE_RUNTIMES="libcxxabi;libcxx;libunwind" -DLLVM_ENABLE_SPHINX=ON ./runtimes
          TZ=UTC ninja -C libcxx-build docs-libcxx-html
          mkdir built-docs/libcxx
          cp -r libcxx-build/libcxx/docs/* built-docs/libcxx/
      - name: Build libc docs
        if: |
          steps.docs-changed-subprojects.outputs.libc_any_changed == 'true' ||
          steps.docs-changed-subprojects.outputs.common_any_changed == 'true'
        run: |
          cmake -B libc-build -GNinja -DCMAKE_BUILD_TYPE=Release -DLLVM_ENABLE_RUNTIMES="libc" -DLLVM_ENABLE_SPHINX=ON ./runtimes
          TZ=UTC ninja -C libc-build docs-libc-html
          mkdir built-docs/libc
          cp -r libc-build/libc/docs/* built-docs/libc/
      - name: Build OpenMP docs
        if: |
          steps.docs-changed-subprojects.outputs.openmp_any_changed == 'true' ||
          steps.docs-changed-subprojects.outputs.common_any_changed == 'true'
        run: |
          cmake -B openmp-build -GNinja -DCMAKE_BUILD_TYPE=Release -DLLVM_ENABLE_RUNTIMES="openmp" -DLLVM_ENABLE_SPHINX=ON -DLLVM_INCLUDE_TESTS=OFF ./runtimes
          TZ=UTC ninja -C openmp-build docs-openmp-html
          mkdir built-docs/openmp
          cp -r openmp-build/openmp/docs/* built-docs/openmp/
      - name: Upload docs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-output
          path: built-docs/
