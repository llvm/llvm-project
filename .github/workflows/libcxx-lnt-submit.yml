# This file defines a reusable workflow that submits the LNT reports contained in an artifact
# of the current workflow run to our LNT instance.
#
# This allows separating concerns around submission (e.g. access tokens) and generating the
# actual benchmarking data.

name: "[libc++] Submit benchmark results to LNT"

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      artifact-name:
        description: 'The name of the artifact containing the LNT reports to submit'
        required: true
        type: string
      test-suite:
        description: 'The LNT test suite to submit to'
        required: true
        type: string
    secrets:
      LNT_SUBMISSION_TOKEN:
        description: 'The token used to submit to LNT'
        required: true

jobs:
  submit:
    runs-on: ubuntu-26.04
    # This environment stores the token used to submit to LNT. Using an environment makes the token
    # available in this job only.
    environment:
      name: lnt
      deployment: false
    env:
      # Keep in sync with libcxx-benchmark-cron.yml.
      LNT_URL: https://lnt.llvm.org
    steps:
      - name: Checkout the LNT tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: libcxx/utils/ci/lnt

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Download the LNT reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/reports

      - name: Submit to LNT
        env:
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
          LNT_TOKEN: ${{ secrets.LNT_SUBMISSION_TOKEN }}
          TEST_SUITE: ${{ inputs.test-suite }}
        run: |
          shopt -s nullglob
          reports=("${RUNNER_TEMP}"/reports/*.json)
          if [ "${#reports[@]}" -eq 0 ]; then
            echo "error: the ${ARTIFACT_NAME} artifact doesn't contain any LNT report"
            exit 1
          fi

          for report in "${reports[@]}"; do
            libcxx/utils/ci/lnt/submit-benchmarks             \
              --lnt-url "${LNT_URL}"                          \
              --test-suite "${TEST_SUITE}"                    \
              "${report}"
          done
