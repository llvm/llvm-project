name: "Nudge to apply skip-precommit-approval early"

permissions:
  contents: read

on:
  # It's safe to use pull_request_target here, because we aren't checking out
  # code from the pull request branch.
  # See https://securitylab.github.com/research/github-actions-preventing-pwn-requests/
  pull_request_target:
    types:
      - labeled

jobs:
  skip_approval_label_nudge:
    runs-on: ubuntu-26.04
    permissions:
      pull-requests: write
    container:
      image: "ghcr.io/llvm/amd64/ci-ubuntu-26.04-github-automation:latest@sha256:a8499c90a5890da942693c3e6a28113c2b851037c5facbb102a271f690439472"
    # Only nudge the PR author when they apply the label themselves; reviewers
    # may legitimately apply it later.
    if: >-
      (github.repository == 'llvm/llvm-project') &&
      (github.event.label.name == 'skip-precommit-approval') &&
      (github.event.sender.login == github.event.pull_request.user.login)
    steps:
      - name: Nudge to apply skip-precommit-approval early
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          github-automation.py \
            --token "$GH_TOKEN" \
            pr-skip-approval-label-nudge \
            --issue-number "$ISSUE_NUMBER" \
            --author "$PR_AUTHOR"
