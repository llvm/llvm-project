# This file defines a workflow that runs the libc++ benchmarks at the given commit.
# This workflow is intended to be triggered manually or via the Github API. As such,
# it requires several inputs that allow customizing its behavior.

name: "[libc++] Run benchmark suite against commit"

# Keep in sync with libcxx/utils/ci/lnt/dispatch-benchmarks
run-name: "[libc++] Run benchmark suite against ${{ inputs.commit }} on ${{ inputs.lnt-machine }}${{ !inputs.submit-lnt && ' (dry run)' || '' }}"

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'The libc++ commit to benchmark'
        required: true
        type: string
      lnt-machine:
        description: 'The LNT machine configuration to use when benchmarking and to report results as'
        required: true
        type: string
      benchmark-suite-override:
        description: |
          Override the version of the benchmark suite to use (a LLVM monorepo SHA). By default, the version pinned
          for this machine in machines.json is used. This override can be used to dry-run benchmarks with arbitrary
          commits of the benchmark suite, but only the version pinned in machines.json can be used when actually
          submitting to LNT.
        required: false
        type: string
      filter:
        description: 'An optional filter to determine which benchmarks to run'
        required: false
        type: string
      submit-lnt:
        description: 'Whether to submit the results to LNT -- dry-run unless opted in'
        required: false
        type: boolean
        default: false
      lnt-url:
        description: 'The URL of the LNT instance to submit to'
        required: false
        type: string
        default: https://lnt.llvm.org

jobs:
  # Validate the inputs and select the configuration of the machine to benchmark on.
  validate:
    uses: $/.github/workflows/libcxx-lnt-validate.yml
    with:
      lnt-machine: ${{ inputs.lnt-machine }}
      benchmark-suite-override: ${{ inputs.benchmark-suite-override }}
      submit-lnt: ${{ inputs.submit-lnt }}

  run-benchmarks:
    name: Run benchmarks on ${{ inputs.lnt-machine }}
    needs:
      - validate
    runs-on: ${{ fromJSON(needs.validate.outputs.setup).runner }}
    container: ${{ fromJSON(needs.validate.outputs.setup).container || null }}
    defaults:
      run:
        shell: bash
    env:
      BENCHMARK_SUITE_VERSION: ${{ fromJSON(needs.validate.outputs.setup).benchmark-suite-version }}
      CMAKE_CACHE: ${{ fromJSON(needs.validate.outputs.setup).cmake-cache }}
      COMPILER: ${{ fromJSON(needs.validate.outputs.setup).cxx }}
      LIT_PARAMS: ${{ join(fromJSON(needs.validate.outputs.setup).lit-params, ' ') }}
      LNT_MACHINE: ${{ inputs.lnt-machine }}
      TEST_CONFIG: ${{ fromJSON(needs.validate.outputs.setup).test-config }}
      XCODE_VERSION: ${{ fromJSON(needs.validate.outputs.setup).xcode-version }}
      # Where we install the library. This lives inside the workspace so that actions/checkout
      # cleans it up between runs on self-hosted runners.
      INSTALL_DIR: ${{ github.workspace }}/install
    steps:
      - name: Checkout the LLVM monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # We benchmark arbitrary historical commits, which requires the full history to be available.
          fetch-depth: 0
          fetch-tags: true
        # TODO(#226230): Remove this once we have resolved the underlying issue
        # causing actions/checkout to be prematurely killed.
        env:
          GIT_TRACE: "true"
          GIT_CURL_VERBOSE: "true"

      - name: Select Xcode
        if: runner.os == 'macOS'
        run: echo "DEVELOPER_DIR=/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer" >> "${GITHUB_ENV}"

      - name: Install dependencies via Homebrew
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install ninja cmake python@3.14
          echo "$(brew --prefix python@3.14)/libexec/bin" >> "$GITHUB_PATH"

      - name: Diagnose tools in use
        run: |
          cmake --version
          ninja --version
          "${COMPILER}" --version
          python3 --version

      - name: Setup virtual environment
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -r libcxx/utils/ci/lnt/requirements.txt

      # Build the library.
      #
      # A build failure is tolerated on purpose, since the library doesn't build at every historical commit.
      # We still submit an empty run for such commits.
      - name: Build libc++ at ${{ inputs.commit }}
        continue-on-error: true
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          # Clean up any stale install directory
          rm -rf "${INSTALL_DIR}"

          libcxx/utils/build-at-commit                       \
            --git-repo "${GITHUB_WORKSPACE}"                 \
            --commit "${COMMIT}"                             \
            --install-dir "${INSTALL_DIR}"                   \
            --                                               \
            -DCMAKE_CXX_COMPILER="${COMPILER}"               \
            -C "${CMAKE_CACHE}"

      - name: Run the benchmarks
        env:
          COMMIT: ${{ inputs.commit }}
          FILTER: ${{ inputs.filter }}
        run: |
          source .venv/bin/activate
          filter_arg=()
          if [ -n "${FILTER}" ]; then
            filter_arg=(--filter "${FILTER}")
          fi

          read -ra configured_params <<< "${LIT_PARAMS}"
          lit_params=()
          for param in "${configured_params[@]}"; do
            lit_params+=(--param "${param}")
          done

          # If the library build failed, still create an install directory so we
          # run the benchmarks. The benchmarks will fail, and we'll submit an empty
          # LNT report.
          mkdir -p "${INSTALL_DIR}"

          libcxx/utils/ci/lnt/run-benchmarks                            \
            --test-suite-commit "${BENCHMARK_SUITE_VERSION}"            \
            --machine "${LNT_MACHINE}"                                  \
            --compiler "${COMPILER}"                                    \
            --benchmark-commit "${COMMIT}"                              \
            --test-config "${TEST_CONFIG}"                              \
            "${filter_arg[@]}"                                          \
            --output "${COMMIT}.json"                                   \
            -- "${lit_params[@]}" --param "libcxx_installation=${INSTALL_DIR}"

          cat "${COMMIT}.json"

      - name: Upload the LNT report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lnt-report
          path: ${{ inputs.commit }}.json
          if-no-files-found: error

  submit:
    needs:
      - run-benchmarks
    if: ${{ inputs.submit-lnt }}
    uses: $/.github/workflows/libcxx-lnt-submit.yml
    with:
      artifact-name: lnt-report
      test-suite: libcxx
      lnt-url: ${{ inputs.lnt-url }}
