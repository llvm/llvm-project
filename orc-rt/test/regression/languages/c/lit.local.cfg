# Tests that C source constructs behave correctly when JIT'd under the ORC
# runtime. Tests compile with %{cc} and run the result with %{obj-jit}.
#
# Single-object tests are .c files. Tests that link several objects are .test
# files, which use split-file to hold their sources.

config.suffixes = [".c", ".test"]

if "system-windows" in config.available_features:
    config.unsupported = True

if not {"orc-rt-cc", "llvm-jitlink"} <= config.available_features:
    config.unsupported = True
