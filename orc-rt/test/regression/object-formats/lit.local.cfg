# Tests that object format features (e.g. relocations, sections, and
# directives) are handled correctly by the ORC runtime. Tests are assembled
# with %{mc}, and the result run with %{jit}.
#
# Tests live in <format>/<arch>/ subdirectories, which gate on the runtime's
# target.

config.suffixes = [".s"]

if not {"llvm-mc", "llvm-jitlink"} <= config.available_features:
    config.unsupported = True
