# Tests that JIT'd code can use the C APIs that the ORC runtime provides. Each
# test lives at the path of the header that declares the API under test, e.g.
# orc-rt-c/bedrock/host/posix/dlfcn-host.c tests
# orc-rt-c/bedrock/host/posix/dlfcn-host.h. Tests compile with %{cc} and
# %{orc-rt-cflags}, and run the result with %{obj-jit}.
#
# Single-object tests are .c files. Tests that link several objects are .test
# files, which use split-file to hold their sources.

config.suffixes = [".c", ".test"]

if not {"orc-rt-cc", "llvm-jitlink"} <= config.available_features:
    config.unsupported = True
