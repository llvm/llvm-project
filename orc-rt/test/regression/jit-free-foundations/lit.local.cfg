# Tests of ORC runtime facilities that can be exercised without JIT'd code:
# ogre's command line, process info, logging, connection lifecycle, and the
# test-support tools themselves.
#
# Tests here must not compile, link, or run JIT'd code. Tests that do belong
# under languages/ or object-formats/ (see README.md). To enforce this, the
# substitutions for compiling and running JIT'd code are removed here.

config.substitutions = [
    (pattern, replacement)
    for (pattern, replacement) in config.substitutions
    if pattern not in ("%{cc}", "%{cxx}", "%{mc}", "%{jit}")
]
